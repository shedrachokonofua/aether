---
# Uptime Kuma monitors to preconfigure
monitors:
  - name: "shdr.ch"
    url: "https://shdr.ch"
    type: "http"
    interval: 60

  - name: "Keycloak"
    url: "https://auth.shdr.ch/realms/aether"
    type: "http"
    interval: 60

  - name: "OpenWebUI"
    url: "https://ai.shdr.ch"
    type: "http"
    interval: 60

  - name: "Nextcloud"
    url: "https://nextcloud.shdr.ch"
    type: "http"
    interval: 60

  - name: "Jellyfin"
    url: "https://tv.shdr.ch"
    type: "http"
    interval: 60

  - name: "BentoPDF"
    url: "https://pdf.shdr.ch"
    type: "http"
    interval: 60

  - name: "seven30.xyz"
    url: "https://seven30.xyz"
    type: "http"
    interval: 60


  - name: "aether-monitoring-heartbeat"
    type: "push"
    interval: 600
    push_token: "{{ secrets.uptime_kuma_deadman_push_token }}"

  # Internal monitoring-stack health probes. Probed by direct IP:port over the
  # WireGuard link because *.home.shdr.ch resolves to the public gateway from the
  # GCP vigilant, not home Caddy. These catch a PARTIAL monitoring death
  # (e.g. Prometheus down while Grafana stays up) that the Grafana-emitted
  # DeadMansSwitch heartbeat structurally cannot. public:false keeps them off the
  # public status.shdr.ch page; maxretries tolerates a deploy-time pod restart.
  - name: "Prometheus (home)"
    url: "http://{{ vm.monitoring_stack.ip }}:{{ vm.monitoring_stack.ports.prometheus }}/-/ready"
    type: "http"
    interval: 60
    maxretries: 3
    retry_interval: 60
    public: false

  - name: "Loki (home)"
    url: "http://{{ vm.monitoring_stack.ip }}:{{ vm.monitoring_stack.ports.loki }}/ready"
    type: "http"
    interval: 60
    maxretries: 3
    retry_interval: 60
    public: false

  - name: "ClickHouse (home)"
    url: "http://{{ vm.monitoring_stack.ip }}:{{ vm.monitoring_stack.ports.clickhouse }}/ping"
    type: "http"
    interval: 60
    maxretries: 3
    retry_interval: 60
    public: false

  - name: "Grafana (home)"
    url: "http://{{ vm.monitoring_stack.ip }}:{{ vm.monitoring_stack.ports.grafana }}/api/health"
    type: "http"
    interval: 60
    maxretries: 3
    retry_interval: 60
    public: false