---
- name: Setup ZFS Pools and Datasets
  hosts: smith
  vars:
    hdd_pool_name: hdd
    # --- Datasets ---
    # - Use LZ4 compression on all datasets to balance space savings with minimal CPU overhead.
    # - Use smaller record size (16K) for VM disk images to reduce metadata overhead and improve random I/O performance.
    # - Disable atime to reduce write overhead and improve sequential I/O performance.
    datasets:
      - name: "hdd/vm" # VM disk images
        mountpoint: "/mnt/hdd/vm"
        compress: "lz4"
        recordsize: "default"
        atime: "off"
      - name: "hdd/data" # Generic data storage
        mountpoint: "/mnt/hdd/data"
        compress: "lz4"
        recordsize: "default"
        atime: "off"
      - name: "hdd/backups-vm" # VM backups
        mountpoint: "/mnt/hdd/backups-vm"
        compress: "lz4"
        recordsize: "default"
        atime: "off"
      - name: "hdd/backups-data" # Generic data backups
        mountpoint: "/mnt/hdd/backups-data"
        compress: "lz4"
        recordsize: "default"
        atime: "off"
      - name: "hdd/blockchain" # Bitcoin/Monero blockchain data
        mountpoint: "/mnt/hdd/blockchain"
        compress: "lz4"
        recordsize: "default"
        atime: "off"
    # ARC was uncapped (default: up to all of RAM, 23 GB in use on
    # 2026-10-15). Capping it leaves room for talos-smith to grow; the HDD
    # pool serves NFS and backups, which do not need a bigger cache.
    zfs_arc_max_bytes: 17179869184 # 16 GiB
  tasks:
    # --- ARC cap ---
    - name: Persist the ZFS ARC cap
      copy:
        dest: /etc/modprobe.d/zfs-arc.conf
        content: "options zfs zfs_arc_max={{ zfs_arc_max_bytes }}\n"
        mode: "0644"
      register: zfs_arc_conf
      tags: [arc]

    - name: Rebuild initramfs so the ARC cap applies at boot
      command: update-initramfs -u -k all
      when: zfs_arc_conf.changed
      tags: [arc]

    - name: Apply the ZFS ARC cap now
      shell: |
        current=$(cat /sys/module/zfs/parameters/zfs_arc_max)
        if [ "$current" != "{{ zfs_arc_max_bytes }}" ]; then
          echo {{ zfs_arc_max_bytes }} > /sys/module/zfs/parameters/zfs_arc_max
          echo changed
        fi
      register: zfs_arc_runtime
      changed_when: "'changed' in zfs_arc_runtime.stdout"
      tags: [arc]

    # --- Pool Creation Tasks ---
    - name: Check if HDD pool "{{ hdd_pool_name }}" exists
      shell: "zpool list -H -o name | grep -w {{ hdd_pool_name }}"
      register: hdd_pool_check
      ignore_errors: true
      changed_when: false

    - name: Create HDD pool "{{ hdd_pool_name }}" as RAID10 (2 mirrored vdevs) if not exists
      command: "zpool create {{ hdd_pool_name }} mirror /dev/sda /dev/sdb mirror /dev/sdc /dev/sdd"
      when: hdd_pool_check.rc != 0

    # --- Dataset Creation Tasks ---
    - name: Ensure ZFS datasets exist
      shell: |
        if ! zfs list {{ item.name }} > /dev/null 2>&1; then
          zfs create {{ item.name }}
        fi
      args:
        executable: /bin/bash
      loop: "{{ datasets }}"
      loop_control:
        loop_var: item

    # --- Recommended ZFS Configuration ---
    - name: Apply recommended ZFS properties on datasets
      shell: |
        {% if item.compress != 'default' %}
        zfs set compress={{ item.compress }} {{ item.name }};
        {% endif %}
        {% if item.recordsize != 'default' %}
        zfs set recordsize={{ item.recordsize }} {{ item.name }};
        {% endif %}
        {% if item.atime != 'default' %}
        zfs set atime={{ item.atime }} {{ item.name }};
        {% endif %}
      args:
        executable: /bin/bash
      loop: "{{ datasets }}"
      loop_control:
        loop_var: item

    - name: Set mount points
      shell: zfs set mountpoint={{ item.mountpoint }} {{ item.name }}
      args:
        executable: /bin/bash
      loop: "{{ datasets }}"
      loop_control:
        loop_var: item

    - name: Check if zfs-hdd-vm-dataset storage is added to proxmox
      command: pvesm status --storage zfs-hdd-vm-dataset
      register: hdd_pool_status
      ignore_errors: yes
      changed_when: false

    - name: Add zfs-hdd-vm-dataset storage to proxmox if not exists
      command: pvesm add zfspool zfs-hdd-vm-dataset --pool hdd/vm --sparse 1 --content images,rootdir --nodes smith
      when: hdd_pool_status.rc != 0
