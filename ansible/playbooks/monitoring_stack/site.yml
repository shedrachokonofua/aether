---
- name: Deploy monitoring stack
  hosts: monitoring-stack
  gather_facts: true
  vars:
    # Disable OTLP receiver in vm_monitoring_agent - central collector handles it
    otlp_receiver_enabled: false
    clickhouse_admin_user: aether
    clickhouse_grafana_user: grafana_readonly
    clickhouse_grafana_role: grafana_readonly_role
    clickhouse_grafana_databases:
      - zeek
      - suricata
      - argos
      - network
      - estate_scan
    # Preserve the final newline: immutable migration ledger checksum.
    estate_scan_schema_checksum: "{{ lookup('file', playbook_dir ~ '/clickhouse/11-estate-scan-schema.sql', rstrip=False) | hash('sha256') }}"
    estate_scan_inventory_schema_checksum: "{{ lookup('file', playbook_dir ~ '/clickhouse/12-estate-scan-inventory.sql', rstrip=False) | hash('sha256') }}"
    estate_scan_service_observations_checksum: "{{ lookup('file', playbook_dir ~ '/clickhouse/19-estate-scan-service-observations.sql', rstrip=False) | hash('sha256') }}"
    estate_scan_clickhouse_user: estate_scan
    estate_scan_clickhouse_role: estate_scan_writer_role
    argos_version: "857c94e60d71ae90d70f05a21b570fcdf0bc89e9"
    argos_artifact_url: "https://gitlab.home.shdr.ch/so/argos/-/jobs/13409/artifacts/raw/artifacts/argos"
    argos_binary_sha256: "dfd105d156e4c1cfe68dd07bcfafe7bed7be857a2a27a75da13a6a13c09819df"
    # Preserve the final newline: this is the exact SHA-256 Argos and operators
    # use for the immutable migration ledger, not Ansible's trimmed file lookup.
    argos_schema_checksum: "{{ lookup('file', playbook_dir ~ '/clickhouse/10-argos-schema.sql', rstrip=False) | hash('sha256') }}"
    argos_clickhouse_user: argos
    argos_clickhouse_role: argos_detector_role
    # A10 uses the 60-second measured Zeek acknowledgement-to-typed-row SLO.
    # 300 seconds is both the five-minute floor and more than 2x that SLO.
    argos_supervisor_tick_seconds: 60
    argos_evaluation_interval_seconds: 3600
    argos_ingest_settle_seconds: 300
    argos_zeek_retention_seconds: 1209600
    argos_feature_lookback_seconds: 86400
    argos_max_catchup_cycles: 12
    # A full 50k-pair feature batch can exceed ClickHouse's 1.86 GiB per-query
    # ceiling on busy hours. Smaller deterministic pages preserve coverage
    # while keeping the 24-hour rolling aggregation bounded.
    argos_max_changed_pairs_per_page: 5000
    argos_max_changed_pairs_per_cycle: 250000
    argos_query_timeout_seconds: 60
    # Ten days of the then-current fourteen-day Zeek retention. This value goes
    # stale as the TTL window slides. Argos now reads the live zeek.conn TTL
    # horizon during preflight and refuses to start (exit 10, and `argos check`
    # fails) when the bootstrap watermark already sits outside it, rather than
    # replaying deleted data as successful empty cycles. Refresh this to a
    # currently-valid interval-aligned instant in the same change that bumps
    # argos_version, and keep at least 24 hours of retention headroom beyond
    # the measured catch-up duration.
    argos_bootstrap_start: "2026-07-01T00:00:00Z"
    argos_service_enabled: false
  roles:
    - common
    - vm_baseline
    - dnf
    - vm_monitoring_agent
  tasks:
    # Keep Loki local state on the dedicated telemetry disk alongside ClickHouse.
    - name: Install telemetry filesystem tooling
      ansible.builtin.dnf:
        name:
          - rsync
          - xfsprogs
        state: present
      become: true
      tags: [loki, clickhouse]

    - name: Verify dedicated telemetry archive disk is attached
      ansible.builtin.assert:
        that:
          - ansible_devices.vdb is defined
        fail_msg: "Expected the Tofu-managed telemetry archive disk at /dev/vdb."
      tags: [loki, clickhouse]

    - name: Format dedicated telemetry archive disk
      community.general.filesystem:
        dev: /dev/vdb
        fstype: xfs
        resizefs: true
      become: true
      tags: [loki, clickhouse]

    - name: Remove legacy telemetry archive mount
      ansible.posix.mount:
        path: /var/lib/thanos
        state: absent
      become: true
      tags: [loki, clickhouse]

    - name: Remove legacy telemetry archive mountpoint
      ansible.builtin.file:
        path: /var/lib/thanos
        state: absent
      become: true
      tags: [loki, clickhouse]

    - name: Create telemetry archive data mountpoint
      ansible.builtin.file:
        path: /var/lib/telemetry
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true
      tags: [loki, clickhouse]

    - name: Mount dedicated telemetry archive disk
      ansible.posix.mount:
        path: /var/lib/telemetry
        src: /dev/vdb
        fstype: xfs
        opts: defaults,noatime
        state: mounted
      become: true
      tags: [loki, clickhouse]

    - name: Create Loki data directory on telemetry disk
      ansible.builtin.file:
        path: /var/lib/telemetry/loki
        state: directory
        owner: aether
        group: aether
        mode: "0777"
      become: true
      tags: [loki]

    - name: Check for legacy Loki data on the root disk
      ansible.builtin.stat:
        path: /home/aether/loki/data
      register: legacy_loki_data
      tags: [loki]

    - name: Seed Loki data on the telemetry disk
      ansible.builtin.command:
        argv:
          - rsync
          - -aHAX
          - --numeric-ids
          - /home/aether/loki/data/
          - /var/lib/telemetry/loki/
      become: true
      when: legacy_loki_data.stat.exists
      tags: [loki]

    - name: Check whether the Loki quadlet exists
      ansible.builtin.stat:
        path: /home/aether/.config/containers/systemd/loki.container
      register: loki_quadlet
      tags: [loki]

    - name: Stop Loki for the final data sync
      ansible.builtin.systemd:
        name: loki
        state: stopped
        scope: user
      when:
        - legacy_loki_data.stat.exists
        - loki_quadlet.stat.exists
      tags: [loki]

    - name: Finalize Loki data on the telemetry disk
      ansible.builtin.command:
        argv:
          - rsync
          - -aHAX
          - --delete
          - --numeric-ids
          - /home/aether/loki/data/
          - /var/lib/telemetry/loki/
      become: true
      when: legacy_loki_data.stat.exists
      tags: [loki]

    # === Directory Setup ===
    - name: Create prometheus directories
      become: true
      file:
        path: "{{ item }}"
        state: directory
        mode: "0777"
        owner: aether
        group: aether
      loop:
        - ./prometheus/data
        - ./prometheus/rules
      tags: [prometheus]

    - name: Create Loki configuration directory
      become: true
      ansible.builtin.file:
        path: ./loki
        state: directory
        mode: "0777"
        owner: aether
        group: aether
      tags: [loki]

    - name: Create otel directory
      become: true
      file:
        path: ./otel
        state: directory
        mode: "0777"
        owner: aether
        group: aether
      tags: [otel]

    - name: Create pve-exporter directory
      become: true
      file:
        path: ./pve-exporter
        state: directory
        mode: "0777"
        owner: aether
        group: aether
      tags: [pve-exporter]

    - name: Create pbs-exporter directory
      become: true
      file:
        path: ./pbs-exporter
        state: directory
        mode: "0777"
        owner: aether
        group: aether
      tags: [pbs-exporter]

    - name: Create blackbox-exporter directory
      become: true
      file:
        path: ./blackbox
        state: directory
        mode: "0777"
        owner: aether
        group: aether
      tags: [blackbox]


    - name: Create clickhouse directories
      become: true
      file:
        path: "{{ item }}"
        state: directory
        mode: "0777"
        owner: aether
        group: aether
      loop:
        - ./clickhouse/data
        - ./clickhouse/init
        - ./clickhouse/config.d
        - ./clickhouse/users.d
      tags: [clickhouse]

    - name: Check ClickHouse telemetry disk directory
      ansible.builtin.stat:
        path: /var/lib/telemetry/clickhouse
      become: true
      register: clickhouse_telemetry_directory
      tags: [clickhouse]

    - name: Create ClickHouse telemetry disk directory
      ansible.builtin.file:
        path: /var/lib/telemetry/clickhouse
        state: directory
        owner: aether
        group: aether
        mode: "0750"
      become: true
      when: not clickhouse_telemetry_directory.stat.exists
      tags: [clickhouse]

    # UID 101 in the image is a subordinate host UID with rootless Podman.
    - name: Check ClickHouse telemetry ownership inside Podman user namespace
      ansible.builtin.command:
        argv: [podman, unshare, stat, -c, "%u:%g", /var/lib/telemetry/clickhouse]
      become: true
      become_user: aether
      register: clickhouse_telemetry_owner
      changed_when: false
      tags: [clickhouse]

    - name: Set ClickHouse telemetry ownership inside Podman user namespace
      ansible.builtin.command:
        argv: [podman, unshare, chown, -R, "101:101", /var/lib/telemetry/clickhouse]
      become: true
      become_user: aether
      when: clickhouse_telemetry_owner.stdout | trim != '101:101'
      tags: [clickhouse]

    # === Configuration Files ===
    - name: Remove retired Thanos quadlet definitions
      ansible.builtin.file:
        path: "/home/aether/.config/containers/systemd/{{ item }}.container"
        state: absent
      loop:
        - thanos-sidecar
        - thanos-store
        - thanos-compact
        - thanos-query
      tags: [monitoring-pod]

    - name: Discover retired monitoring quadlets
      ansible.builtin.stat:
        path: "/home/aether/.config/containers/systemd/{{ item }}.container"
      loop: [tempo, greptime, janus, grafana]
      register: retired_monitoring_quadlets
      tags: [monitoring-pod]

    - name: Stop retired monitoring services without deleting their data
      ansible.builtin.systemd:
        name: "{{ item.item }}"
        state: stopped
        scope: user
      loop: "{{ retired_monitoring_quadlets.results }}"
      when: item.stat.exists
      tags: [monitoring-pod]

    - name: Remove retired monitoring quadlet definitions
      ansible.builtin.file:
        path: "/home/aether/.config/containers/systemd/{{ item }}.container"
        state: absent
      loop: [tempo, greptime, janus, grafana]
      tags: [monitoring-pod]

    - name: Template prometheus config
      template:
        src: ./prometheus.yml.j2
        dest: ./prometheus/prometheus.yml
        mode: "0644"
      tags: [prometheus, prometheus-config]

    - name: Copy prometheus rules
      copy:
        src: ./prometheus-rules/
        dest: ./prometheus/rules/
        mode: "0644"
      tags: [prometheus]

    - name: Copy blackbox-exporter config
      copy:
        src: ./blackbox.yml
        dest: ./blackbox/blackbox.yml
        mode: "0755"
      register: blackbox_config_install
      tags: [blackbox]

    # tls_connect verifies internal Aether-CA endpoints (OpenBao, step-ca);
    # the image only trusts public roots. Source is the step-ca root that the
    # openbao_agent role bootstraps onto this host.
    - name: Copy step-ca root for blackbox TLS probes
      copy:
        src: /etc/ssl/certs/step-ca-root.crt
        dest: ./blackbox/step-ca-root.crt
        remote_src: true
        mode: "0644"
      register: blackbox_ca_install
      tags: [blackbox]

    - name: Create loki config
      copy:
        src: ./loki_config.yml
        dest: ./loki/loki_config.yml
        mode: "0755"
      tags: [loki]

    - name: Create otel config
      template:
        src: ./otel_config.yml.j2
        dest: ./otel/otel_config.yml
        mode: "0644"
      tags: [otel]

    - name: Create PVE exporter config
      copy:
        content: |
          default:
            user: {{ secrets.proxmox.cluster_username }}
            token_name: {{ secrets.proxmox.monitoring_token_id }}
            token_value: "{{ secrets.proxmox.monitoring_secret }}"
            verify_ssl: false
        dest: ./pve-exporter/pve.yml
        mode: "0644"
      tags: [pve-exporter]

    - name: Copy ClickHouse init scripts
      copy:
        src: ./clickhouse/
        dest: ./clickhouse/init/
        mode: "0644"
      # Carries the exporter tags too: the labeling tasks below run under those
      # tags and fail on files this copy never delivered (2026-07-28: a
      # --tags gigahub-exporter run hit an absent 16-gigahub-observations.sql).
      tags: [clickhouse, qss-exporter, gigahub-exporter, vyos-exporter]

    - name: Label VyOS observation schema for the ClickHouse container
      ansible.builtin.file:
        path: /home/aether/clickhouse/init/09-vyos-observations.sql
        setype: container_file_t
      become: true
      tags: [clickhouse, vyos-exporter]

    - name: Label observation pipeline schemas for the ClickHouse container
      ansible.builtin.file:
        path: "/home/aether/clickhouse/init/{{ item }}"
        setype: container_file_t
      become: true
      loop:
        - 13-qss-observations.sql
        - 14-mac-first-seen.sql
        - 15-mac-ip-history.sql
        - 16-gigahub-observations.sql
      tags: [clickhouse, qss-exporter, gigahub-exporter]

    - name: Apply idempotent observation pipeline schemas
      containers.podman.podman_container_exec:
        name: clickhouse
        argv:
          - clickhouse-client
          - --user
          - "{{ clickhouse_admin_user }}"
          - --multiquery
          - --queries-file
          - "/docker-entrypoint-initdb.d/{{ item }}"
      loop:
        - 13-qss-observations.sql
        - 14-mac-first-seen.sql
        - 15-mac-ip-history.sql
        - 16-gigahub-observations.sql
      no_log: false
      tags: [clickhouse, qss-exporter, gigahub-exporter]

    - name: Backfill mac_first_seen from existing observations (idempotent)
      containers.podman.podman_container_exec:
        name: clickhouse
        argv:
          - clickhouse-client
          - --user
          - "{{ clickhouse_admin_user }}"
          - --query
          - >-
            INSERT INTO network.mac_first_seen
            SELECT lower(mac_address) AS mac, min(timestamp), max(timestamp),
            anyLast(hostname)
            FROM network.observations
            WHERE mac_address IS NOT NULL AND mac_address != ''
              AND lower(substring(mac_address, 2, 1)) NOT IN
              ('1', '3', '5', '7', '9', 'b', 'd', 'f')
            GROUP BY mac
      no_log: false
      tags: [clickhouse, qss-exporter]

    - name: Backfill mac_ip_history from existing observations (idempotent)
      containers.podman.podman_container_exec:
        name: clickhouse
        argv:
          - clickhouse-client
          - --user
          - "{{ clickhouse_admin_user }}"
          - --query
          - >-
            INSERT INTO network.mac_ip_history
            SELECT lower(mac_address) AS mac, lower(ip_address) AS ip,
            min(timestamp), max(timestamp), anyLast(hostname), source_type
            FROM network.observations
            WHERE mac_address IS NOT NULL AND mac_address != ''
              AND ip_address IS NOT NULL AND ip_address != ''
              AND source_type != ''
              AND lower(substring(mac_address, 2, 1)) NOT IN
              ('1', '3', '5', '7', '9', 'b', 'd', 'f')
            GROUP BY mac, ip, source_type
      no_log: false
      tags: [clickhouse, qss-exporter]

    - name: Copy ClickHouse config overrides
      copy:
        src: ./clickhouse-config.d/
        dest: ./clickhouse/config.d/
        mode: "0644"
      register: clickhouse_config_install
      tags: [clickhouse]

    - name: Copy ClickHouse user profile overrides
      copy:
        src: ./clickhouse-users.d/
        dest: ./clickhouse/users.d/
        mode: "0644"
      register: clickhouse_users_install
      tags: [clickhouse]

    # === Pods ===
    - name: Create monitoring stack pod
      containers.podman.podman_pod:
        name: monitoring-stack
        ports:
          - "{{ vm.monitoring_stack.ports.prometheus }}:9090"
          - "{{ vm.monitoring_stack.ports.loki }}:3100"
          - "{{ vm.monitoring_stack.ports.loki_push }}:3500" # collector Loki push-API receiver (unpoller UniFi events)
          - "{{ vm.monitoring_stack.ports.otel_grpc }}:4317"
          - "{{ vm.monitoring_stack.ports.otel_http }}:4318"
          - "{{ vm.monitoring_stack.ports.otel_metrics }}:8888"
          - "{{ vm.monitoring_stack.ports.otel_prometheus }}:8889"
          - "{{ vm.monitoring_stack.ports.clickhouse }}:8123" # ClickHouse HTTP/Play UI
          - "9221:9221" # PVE Exporter
          - "10019:10019" # PBS Exporter
          - "{{ vm.monitoring_stack.ports.blackbox }}:9115" # blackbox-exporter (cert expiry probes)
        state: quadlet
        restart_policy: on-failure
        recreate: true
        quadlet_options:
          - |
            [Install]
            WantedBy=default.target
      tags:
        [
          prometheus,
          loki,
          otel,
          clickhouse,
          pve-exporter,
          pbs-exporter,
          blackbox,
          monitoring-pod,
        ]

    # === Volumes ===
    - name: Create prometheus storage volume
      containers.podman.podman_volume:
        name: prometheus_storage
        state: quadlet
      tags: [prometheus]

    - name: Create clickhouse storage volume
      containers.podman.podman_volume:
        name: clickhouse_storage
        state: quadlet
      tags: [clickhouse]

    # === Containers ===
    - name: Start prometheus
      containers.podman.podman_container:
        name: prometheus
        image: docker.io/prom/prometheus:latest
        pod: monitoring-stack.pod
        volumes:
          - prometheus_storage.volume:/prometheus
          - /home/aether/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:Z
          - /home/aether/prometheus/rules:/etc/prometheus/rules:Z
        command:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
          # 30d (was 15d default): the 14d security-rule soak window barely fit inside
          # default retention, so promotion reviews lost the pre-soak context. 30d covers
          # soak + prior fortnight and widens Argos's feature-extraction window.
          # Disk: ~15-22GB extra at current series counts.
          - "--storage.tsdb.retention.time=30d"
          - "--web.console.libraries=/etc/prometheus/console_libraries"
          - "--web.console.templates=/etc/prometheus/consoles"
          - "--web.enable-lifecycle"
          # Central OTel collector pushes fleet metrics here (prometheusremotewrite
          # exporter -> localhost:9090/api/v1/write) since the 2026-07-26 cutover.
          - "--web.enable-remote-write-receiver"
        env:
          # GOGC=200: verified ~0.15 core less GC CPU (16% vs ~20% VM). Costs ~2GB RSS (prom ~4.8GB);
          # box has 7GB+ free so it's a good RAM-for-CPU trade on this power-optimized stack.
          GOGC: "200"
          GOMEMLIMIT: "5GiB" # soft cap: runtime tightens GC (not OOM) if heap spikes on WAL-replay/compaction/heavy query
        stop_timeout: 120
        state: quadlet
        quadlet_options:
          - |
            [Service]
            Restart=on-failure
            RestartSec=30s
            TimeoutStartSec=300s
            TimeoutStopSec=120s
      tags: [prometheus, prometheus-quadlet]

    - name: Start blackbox-exporter
      containers.podman.podman_container:
        name: blackbox-exporter
        image: quay.io/prometheus/blackbox-exporter:latest
        pod: monitoring-stack.pod
        volumes:
          - /home/aether/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:Z
          - /home/aether/blackbox/step-ca-root.crt:/etc/blackbox_exporter/step-ca-root.crt:ro,Z
        command:
          - "--config.file=/etc/blackbox_exporter/config.yml"
        state: quadlet
        quadlet_options:
          - |
            [Service]
            Restart=on-failure
            RestartSec=30s
            TimeoutStartSec=300s
      register: blackbox_quadlet_definition
      tags: [blackbox]

    - name: Start Loki
      containers.podman.podman_container:
        name: loki
        # Pinned (was :latest) 2026-07-11: a fresh :latest pull on a pod restart
        # start-timed-out and killed the log sink, cascading to k8s-metrics-dead.
        # Renovate bumps this.
        image: docker.io/grafana/loki:3.7.3
        pod: monitoring-stack.pod
        pull: missing
        command:
          - "-config.file=/etc/loki/config.yml"
        volumes:
          - /home/aether/loki/loki_config.yml:/etc/loki/config.yml:Z
          - /var/lib/telemetry/loki:/var/lib/loki:Z
        state: quadlet
        # WAL replay under mass-restart contention needs headroom past the default.
        quadlet_options:
          - |
            [Service]
            Restart=on-failure
            RestartSec=30s
            TimeoutStartSec=300
      tags: [loki]

    - name: Start otel collector
      containers.podman.podman_container:
        name: otel_collector
        # Pinned (was :latest) 2026-07-11: storage/schema surgery and the alpha
        # clickhouse exporter make version surprises unacceptable. Renovate bumps this.
        image: docker.io/otel/opentelemetry-collector-contrib:0.156.0
        pod: monitoring-stack.pod
        pull: missing
        volumes:
          - /home/aether/otel/otel_config.yml:/etc/otelcol-contrib/config.yaml:Z
        env:
          GOGC: "200" # ~0.15 core less GC CPU for ~+2GB RSS; box has ample free RAM.
          GOMEMLIMIT: "3GiB" # MUST stay below the memory_limiter soft refusal (limit-spike = 3200MiB): GC fights heap growth before the limiter drops data (2026-07-11 incident)
        state: quadlet
        quadlet_options:
          - |
            [Service]
            Restart=on-failure
            RestartSec=30s
            TimeoutStartSec=300s
      tags: [otel]

    - name: Start PVE exporter
      containers.podman.podman_container:
        name: pve_exporter
        pod: monitoring-stack.pod
        image: docker.io/prompve/prometheus-pve-exporter:latest
        pull: always
        state: quadlet
        volumes:
          - /home/aether/pve-exporter/pve.yml:/etc/prometheus/pve.yml:Z
        quadlet_options:
          - |
            [Service]
            Restart=on-failure
            RestartSec=30s
            TimeoutStartSec=300s
      tags: [pve-exporter]

    - name: Start PBS exporter
      containers.podman.podman_container:
        name: pbs_exporter
        pod: monitoring-stack.pod
        image: ghcr.io/natrontech/pbs-exporter:latest
        pull: always
        state: quadlet
        env:
          PBS_ENDPOINT: "https://{{ vm.backup_stack.ip }}:8007"
          PBS_USERNAME: "{{ secrets.pbs.monitoring_user }}"
          PBS_API_TOKEN: "{{ secrets.pbs.monitoring_secret }}"
          PBS_API_TOKEN_NAME: "{{ secrets.pbs.monitoring_token_id }}"
          PBS_INSECURE: "true"
          PBS_LISTEN_ADDRESS: ":10019"
        quadlet_options:
          - |
            [Service]
            Restart=on-failure
            RestartSec=30s
            TimeoutStartSec=300s
      tags: [pbs-exporter]

    - name: Start ClickHouse
      containers.podman.podman_container:
        name: clickhouse
        pod: monitoring-stack.pod
        image: docker.io/clickhouse/clickhouse-server:26.6.1.1193
        pull: missing
        state: quadlet
        volumes:
          - clickhouse_storage.volume:/var/lib/clickhouse:Z
          - /var/lib/telemetry/clickhouse:/var/lib/telemetry/clickhouse:Z
          - /home/aether/clickhouse/init:/docker-entrypoint-initdb.d:Z
          - /home/aether/clickhouse/config.d/aether-system-logs.xml:/etc/clickhouse-server/config.d/aether-system-logs.xml:Z
          - /home/aether/clickhouse/config.d/aether-telemetry-storage.xml:/etc/clickhouse-server/config.d/aether-telemetry-storage.xml:Z
          - /home/aether/clickhouse/users.d/aether-default-profile.xml:/etc/clickhouse-server/users.d/aether-default-profile.xml:Z
        env:
          CLICKHOUSE_USER: aether
          CLICKHOUSE_PASSWORD: "{{ secrets.clickhouse.password }}"
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        quadlet_options:
          - |
            [Service]
            Restart=on-failure
            RestartSec=30s
            TimeoutStartSec=300s
      register: clickhouse_quadlet_definition
      tags: [clickhouse]

    # === Systemd ===
    - name: Reload systemd
      systemd:
        daemon_reload: yes
        scope: user
      tags:
        [
          prometheus,
          prometheus-quadlet,
          loki,
          otel,
          clickhouse,
          pve-exporter,
          pbs-exporter,
          systemd,
          monitoring-pod,
        ]

    - name: Start monitoring stack quadlet
      systemd:
        name: monitoring-stack-pod
        state: restarted
        scope: user
      tags:
        [
          prometheus,
          loki,
          otel,
          clickhouse,
          pve-exporter,
          pbs-exporter,
          monitoring-pod,
        ]


    - name: Discover monitoring component quadlets
      ansible.builtin.stat:
        path: "/home/aether/.config/containers/systemd/{{ item.file }}.container"
      loop:
        - { file: prometheus, unit: prometheus }
        - { file: blackbox-exporter, unit: blackbox-exporter }
        - { file: loki, unit: loki }
        - { file: otel_collector, unit: otel_collector }
        - { file: pve_exporter, unit: pve_exporter }
        - { file: pbs_exporter, unit: pbs_exporter }
        - { file: clickhouse, unit: clickhouse }
      register: monitoring_component_quadlets
      tags:
        [prometheus, blackbox, loki, otel, pve-exporter, pbs-exporter, clickhouse, monitoring-pod]

    - name: Ensure existing monitoring component quadlets are running
      ansible.builtin.systemd:
        name: "{{ item.item.unit }}"
        state: started
        scope: user
      loop: "{{ monitoring_component_quadlets.results }}"
      when: item.stat.exists
      tags:
        [prometheus, blackbox, loki, otel, pve-exporter, pbs-exporter, clickhouse, monitoring-pod]

    - name: Restart blackbox-exporter after config, CA, or quadlet updates
      ansible.builtin.systemd:
        name: blackbox-exporter
        state: restarted
        scope: user
        daemon_reload: true
      when: >-
        (blackbox_config_install is defined and blackbox_config_install.changed)
        or (blackbox_ca_install is defined and blackbox_ca_install.changed)
        or (blackbox_quadlet_definition is defined and blackbox_quadlet_definition.changed)
      tags: [blackbox]

    - name: Wait for Loki after telemetry disk migration
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ vm.monitoring_stack.ports.loki }}/ready"
        method: GET
        status_code: 200
      register: loki_health
      until: loki_health.status == 200
      retries: 60
      delay: 5
      tags: [loki]

    - name: Remove migrated Loki data from the root disk
      ansible.builtin.file:
        path: /home/aether/loki/data
        state: absent
      become: true
      when: legacy_loki_data.stat.exists
      tags: [loki]


    - name: Restart ClickHouse after configuration or quadlet changes
      ansible.builtin.systemd:
        name: clickhouse
        state: restarted
        scope: user
        daemon_reload: true
      when: >-
        (clickhouse_config_install is defined and clickhouse_config_install.changed)
        or (clickhouse_users_install is defined and clickhouse_users_install.changed)
        or (clickhouse_quadlet_definition is defined and clickhouse_quadlet_definition.changed)
      tags: [clickhouse]

    - name: Wait for ClickHouse to be ready
      uri:
        url: "http://127.0.0.1:{{ vm.monitoring_stack.ports.clickhouse }}/ping"
        method: GET
        return_content: true
        status_code: 200
      register: clickhouse_health
      until:
        - clickhouse_health.status == 200
        - clickhouse_health.content | trim == "Ok."
      retries: 30
      delay: 5
      tags: [clickhouse, clickhouse-grafana-reader, argos, estate-scan]

    # Init scripts are not rerun on existing volumes; reconcile after readiness.
    - name: Copy and label ClickHouse telemetry schema
      ansible.builtin.copy:
        src: ./clickhouse/20-otel-schema.sql
        dest: /home/aether/clickhouse/init/20-otel-schema.sql
        mode: "0644"
        setype: container_file_t
      become: true
      tags: [clickhouse, clickhouse-otel]

    - name: Remove superseded invalid metrics init script
      ansible.builtin.file:
        path: /home/aether/clickhouse/init/metrics-schema.sql
        state: absent
      become: true
      tags: [clickhouse, clickhouse-otel]

    - name: Reconcile ClickHouse telemetry schema
      containers.podman.podman_container_exec:
        name: clickhouse
        argv:
          - clickhouse-client
          - --user
          - "{{ clickhouse_admin_user }}"
          - --multiquery
          - --queries-file
          - /docker-entrypoint-initdb.d/20-otel-schema.sql
      tags: [clickhouse, clickhouse-otel]

    # Init scripts run only on an empty ClickHouse volume. Reapply this
    # idempotent DDL after readiness so existing monitoring-stack deployments
    # gain the VyOS observation schema too.
    - name: Reconcile VyOS observation ClickHouse schema
      containers.podman.podman_container_exec:
        name: clickhouse
        argv:
          - clickhouse-client
          - --user
          - "{{ clickhouse_admin_user }}"
          - --multiquery
          - --queries-file
          - /docker-entrypoint-initdb.d/09-vyos-observations.sql
      tags: [clickhouse, vyos-exporter]

    - name: Deploy Argos contracts and staged worker
      ansible.builtin.import_tasks: argos.yml
      tags: [argos]

    - name: Reconcile estate scan ClickHouse schema
      ansible.builtin.import_tasks: estate_scan.yml
      tags: [estate-scan, clickhouse]

    - name: Validate Grafana ClickHouse credential is decrypted
      assert:
        that:
          - secrets.clickhouse.grafana_readonly_password is string
          - secrets.clickhouse.grafana_readonly_password | length >= 32
          - not secrets.clickhouse.grafana_readonly_password.startswith('ENC[')
        fail_msg: >-
          The Grafana ClickHouse credential is unavailable or still encrypted;
          run the tagged play normally so common : Load secrets executes.
      register: clickhouse_grafana_secret_check
      tags: [clickhouse, clickhouse-grafana-reader, estate-scan]

    # Exact replacement prevents out-of-band grants from accumulating on this
    # IaC-owned agent-facing identity.
    - name: Reconcile Grafana ClickHouse read-only access
      containers.podman.podman_container_exec:
        name: clickhouse
        argv:
          - clickhouse-client
          - --user
          - "{{ clickhouse_admin_user }}"
          - --multiquery
          - --query
          - |
            CREATE ROLE OR REPLACE {{ clickhouse_grafana_role }} SETTINGS
              readonly = 1,
              max_execution_time = 30 MIN 1 MAX 60 CHANGEABLE_IN_READONLY,
              max_memory_usage = 2000000000,
              max_threads = 4,
              max_concurrent_queries_for_user = 8,
              max_rows_to_read = 2000000000,
              max_bytes_to_read = 100000000000,
              max_result_rows = 200000,
              result_overflow_mode = 'throw';
            {% for database in clickhouse_grafana_databases + ['otel', 'aether'] %}
            GRANT SELECT ON {{ database }}.* TO {{ clickhouse_grafana_role }};
            GRANT SHOW DATABASES ON {{ database }}.* TO {{ clickhouse_grafana_role }};
            GRANT SHOW TABLES ON {{ database }}.* TO {{ clickhouse_grafana_role }};
            GRANT SHOW COLUMNS ON {{ database }}.* TO {{ clickhouse_grafana_role }};
            {% endfor %}
            CREATE USER IF NOT EXISTS {{ clickhouse_grafana_user }}
              IDENTIFIED WITH sha256_hash BY '{{ secrets.clickhouse.grafana_readonly_password | hash("sha256") }}'
              HOST LOCAL, IP '10.0.2.2' GRANTEES NONE;
            ALTER USER {{ clickhouse_grafana_user }}
              IDENTIFIED WITH sha256_hash BY '{{ secrets.clickhouse.grafana_readonly_password | hash("sha256") }}'
              HOST LOCAL, IP '10.0.2.2' GRANTEES NONE;
            GRANT {{ clickhouse_grafana_role }} TO {{ clickhouse_grafana_user }};
            ALTER USER {{ clickhouse_grafana_user }} DEFAULT ROLE {{ clickhouse_grafana_role }};
      no_log: true
      when:
        - clickhouse_grafana_secret_check is defined
        - clickhouse_grafana_secret_check is succeeded
      tags: [clickhouse, clickhouse-grafana-reader, estate-scan]

    - name: Load ClickHouse telemetry tenants
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/tenants.yml"
        name: clickhouse_otel_tenants
      tags: [clickhouse, clickhouse-otel]

    - name: Check whether ClickHouse default identity exists
      containers.podman.podman_container_exec:
        name: clickhouse
        argv:
          - clickhouse-client
          - --user
          - "{{ clickhouse_admin_user }}"
          - --query
          - "SELECT count() FROM system.users WHERE name = 'default'"
      register: clickhouse_default_user
      changed_when: false
      tags: [clickhouse, clickhouse-otel]

    - name: Render ClickHouse telemetry access policy
      ansible.builtin.template:
        src: ./clickhouse-access/otel-access.sql.j2
        dest: /home/aether/clickhouse/init/otel-access.sql
        owner: aether
        group: aether
        mode: "0600"
        setype: container_file_t
      become: true
      no_log: true
      tags: [clickhouse, clickhouse-otel]

    - name: Reconcile ClickHouse telemetry access policy
      containers.podman.podman_container_exec:
        name: clickhouse
        argv:
          - clickhouse-client
          - --user
          - "{{ clickhouse_admin_user }}"
          - --multiquery
          - --queries-file
          - /docker-entrypoint-initdb.d/otel-access.sql
      no_log: true
      tags: [clickhouse, clickhouse-otel]

- name: Deploy Fleet
  import_playbook: fleet.yml

- name: Deploy journal forwarder
  import_playbook: journal_forwarder.yml

- name: Deploy GigaHub exporter
  import_playbook: gigahub_exporter.yml

- name: Deploy QSS switch exporter
  import_playbook: qss_exporter.yml
