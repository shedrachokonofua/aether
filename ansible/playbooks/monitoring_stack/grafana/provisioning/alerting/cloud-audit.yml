            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              expr: |
                sum(count_over_time(
                  {service_name="vigil", provider="aws"}
                    |~ "aether-home-offsite-backup"
                    |~ "\"event_name\":\"(PutBucketVersioning|PutBucketPolicy|DeleteBucketPolicy|PutLifecycleConfiguration|PutPublicAccessBlock|DeleteBucket|PutBucketAcl|PutObjectLockConfiguration)\""
                  [10m]))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
          domain: security
        annotations:
          summary: "Offsite restic bucket (aether-home-offsite-backup) config mutation"
          description: "Versioning/policy/lifecycle/public-access-block/object-lock change on the offsite restic bucket. Base rate ≈ 0."

      - uid: cloud-audit-aws-rolesanywhere-mutation
        title: AWS Roles Anywhere Mutation
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
