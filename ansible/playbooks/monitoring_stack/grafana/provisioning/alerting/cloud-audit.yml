                sum(count_over_time(
                  {service_name="vigil", provider="gcp"}
                    |~ "\"event_name\":\"(google.iam.(admin|workloadidentity).v1.(CreateServiceAccountKey|CreateServiceAccount|DeleteServiceAccount|SetIamPolicy|UpdateWorkloadIdentityPool|CreateWorkloadIdentityPool|CreateWorkloadIdentityPoolProvider|UpdateWorkloadIdentityPoolProvider|DeleteWorkloadIdentityPool|DeleteWorkloadIdentityPoolProvider)|(SetIamPolicy|CreateApiKey|UpdateApiKey|DeleteApiKey|CreateRole|UpdateRole|DeleteRole))\""
                  [10m]))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
