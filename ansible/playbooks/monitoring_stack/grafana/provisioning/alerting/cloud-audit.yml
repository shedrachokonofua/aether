# =============================================================================
# Cloud-audit (vigil) alerting
# =============================================================================
# All rules ship severity=warning under soak-then-promote (PLAN.md §8):
# 14 days clean, then a single reviewed commit flips the page-class rules to
# critical. The emitted-data contract these match against is
# vigil/docs/schema.md — envelopes, not `raw`.
#
# LogQL selectors may only use INDEXED labels: service_name, provider,
# collector, domain (+ k8s.*). Envelope fields like event_source/event_name
# live in the JSON body and belong in |~ line filters — Loki's OTLP defaults
# (now extended in loki_config.yml) don't index them, and a selector on an
# unindexed label silently matches nothing while the rule shows health=ok.
#
# Not shipped (per PLAN):
# - any-mutation-outside-apply-window: needs the tofu-apply marker signal
#   (continuous-deployment Phase 0); ship disabled later, don't invent it.

apiVersion: 1

groups:
  - orgId: 1
    name: Cloud Audit
    folder: Security
    interval: 1m
    rules:

      # ================= Meta: heartbeat (alerting keys on metrics) =========

      - uid: cloud-audit-run-failed
        title: Cloud Audit Collector Run Failed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-local
            model:
              expr: vigil_collector_run_ok == 0
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
          domain: security
        annotations:
          summary: "vigil collector {{ $labels.collector }} last run failed"
          description: "The last run of {{ $labels.collector }} (provider {{ $labels.provider }}) reported run_ok=0. Check the vigil pod logs in cloud-audit."

      - uid: cloud-audit-feed-absent-5min
        title: Cloud Audit Feed Absent (5m cadence)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-local
            model:
              expr: time() - max by (collector, provider) (max_over_time(vigil_collector_last_success_timestamp_seconds{kind!="snapshot"}[2h])) > bool 1800
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 0s
        labels:
          severity: warning
          domain: security
        annotations:
          summary: "vigil collector {{ $labels.collector }} silent >30m"
          description: "No successful collect from {{ $labels.collector }} in over 30 minutes. The push-gauge may also have gone Prometheus-stale; check the pod first, then this rule's max_over_time wrapper."

      - uid: cloud-audit-feed-absent-daily
        title: Cloud Audit Feed Absent (daily cadence)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-local
            model:
              expr: time() - max by (collector, provider) (max_over_time(vigil_collector_last_success_timestamp_seconds{kind="snapshot"}[26h])) > bool 93600
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 0s
        labels:
          severity: warning
          domain: security
        annotations:
          summary: "vigil snapshot collector {{ $labels.collector }} silent >26h"
          description: "No successful collect from {{ $labels.collector }} in over 26 hours."

      - uid: cloud-audit-loop-absent
        title: Cloud Audit Loop Absent
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              expr: |
                sum(count_over_time(
                  {service_name=~"cloud-audit/vigil-.*"} |= "iteration complete" [6m]))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 0s
        labels:
          severity: warning
          domain: security
        annotations:
          summary: "vigil orchestrator loop silent >6m"
          description: "No 'iteration complete' stdout line in 6m (~1/min expected). Catches a hung process and pod death ~9m ahead of k8s-replicaset-not-ready; the feed-absent rules cover per-collector staleness."

      # ================= AWS ================================================

      - uid: cloud-audit-aws-root-or-console-login
        title: AWS Root or No-MFA Console Login
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              expr: |
                sum(
                  count_over_time({service_name="vigil", provider="aws"} |~ "ConsoleLogin" | json | raw_userIdentity_type="Root" [10m])
                  or
                  count_over_time({service_name="vigil", provider="aws"} |~ "ConsoleLogin" | json | raw_additionalEventData_MFAUsed="No" [10m])
                )
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
          domain: security
        annotations:
          summary: "AWS console login as root or without MFA"
          description: "CloudTrail saw a ConsoleLogin with userIdentity.type=Root or MFAUsed=No. Base rate of legit occurrences ≈ 0 in this estate."

      - uid: cloud-audit-aws-iam-mutation
        title: AWS IAM Mutation
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              expr: |
                sum(count_over_time(
                  {service_name="vigil", provider="aws"}
                    |~ "\"event_source\":\"iam.amazonaws.com\""
                    |~ "\"event_name\":\"(Create|Put|Attach|Detach|Update|Delete)[A-Za-z]+\""
                  [10m]))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
          domain: security
        annotations:
          summary: "AWS IAM Create/Put/Attach/Update/Delete outside review"
          description: "IAM mutation on users, roles, policies, or OIDC providers. Legit changes come from tofu applies; anything else is an incident."

      - uid: cloud-audit-aws-kms-unseal-key-tamper
        title: AWS KMS Unseal Key Tamper
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              expr: |
                sum(
                  count_over_time(
                    {service_name="vigil", provider="aws"}
                      |~ "3ab7209d-870a-42b4-a201-8fca65538c6a"
                      |~ "\"event_name\":\"(ScheduleKeyDeletion|DisableKey|PutKeyPolicy|UpdateKeyDescription|RevokeGrant|CreateGrant)\""
                    [10m])
                  or
                  count_over_time(
                    {service_name="vigil", provider="aws"}
                      |~ "3ab7209d-870a-42b4-a201-8fca65538c6a"
                      |~ "\"event_name\":\"Decrypt\""
                      |~ "\"outcome\":\"failure\""
                    [10m])
                )
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
          domain: security
        annotations:
          summary: "openbao-auto-unseal KMS key tamper or denied Decrypt"
          description: "Key-policy/schedule-deletion/disable/grant change or a failed Decrypt on the openbao-auto-unseal key (3ab7209d-…). This is a crown-jewel key."

      - uid: cloud-audit-aws-backup-bucket-tamper
        title: AWS Offsite Backup Bucket Tamper
        condition: C
        data:
