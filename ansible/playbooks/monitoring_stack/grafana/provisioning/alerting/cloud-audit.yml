                sum(count_over_time(
                  {service_name="vigil", provider="aws"}
                    |~ "\"event_source\":\"rolesanywhere.amazonaws.com\""
                    |~ "\"event_name\":\"(CreateTrustAnchor|DeleteTrustAnchor|UpdateTrustAnchor|CreateProfile|DeleteProfile|UpdateProfile|CreateCrl|DeleteCrl)\""
                  [10m]))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
