                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
          domain: security
        annotations:
          summary: "Roles Anywhere trust-anchor/profile/CRL mutation"
          description: "Mutation on the keyless cert-based trust chain. CreateSession with an unexpected cert CN is reviewed on the dashboard (CN lives in the raw cert PEM)."

      - uid: cloud-audit-aws-analyzer-finding
        title: AWS Access Analyzer Active Finding
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: prometheus-local
            model:
              expr: increase(vigil_aws_access_analyzer_findings{status="active"}[1d])
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
          domain: security
        annotations:
          summary: "New active IAM Access Analyzer finding ({{ $labels.analyzer }})"
          description: "Daily snapshot shows an increase in active findings. Review the analyzer in the AWS console."

      - uid: cloud-audit-aws-ses-reputation
        title: AWS SES Reputation Threshold
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: prometheus-local
            model:
              expr: vigil_aws_ses_bounce_rate > 0.05 or vigil_aws_ses_complaint_rate > 0.001
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
          domain: security
        annotations:
          summary: "SES bounce/complaint rate over threshold"
          description: "Bounce rate >5% or complaint rate >0.1% in the trailing 24h — deliverability risk for the estate's mail."

      # ================= GCP ================================================

