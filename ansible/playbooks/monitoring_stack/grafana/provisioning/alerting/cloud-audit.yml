          domain: security
        annotations:
          summary: "GCP admin-activity on WIF pool/provider, IAM bindings, SA keys, or API keys"
          description: "Admin-activity audit event touching the WIF chain, IAM policy, service-account keys, or API keys. Legit changes come from tofu."

