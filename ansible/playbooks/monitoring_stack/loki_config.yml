auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  grpc_server_max_recv_msg_size: 33554432
  grpc_server_max_send_msg_size: 33554432

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /var/lib/loki

schema_config:
  configs:
    - from: 2020-05-15
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /var/lib/loki/chunks

compactor:
  working_directory: /var/lib/loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

limits_config:
  retention_period: 120d
  reject_old_samples: false
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 16MB
  per_stream_rate_limit_burst: 32MB
  max_line_size: 512KB
  # vigil envelope attributes (provider/collector/domain) must be index
  # labels, not structured metadata — LogQL alert selectors on unindexed
  # labels silently match nothing (cloud-audit rules ran blind until
  # 2026-07-26). Custom entries merge with Loki's built-in default mapping
  # (service.name, k8s.*, …) unless ignore_defaults is set.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - provider
            - collector
            - domain
