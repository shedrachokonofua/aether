---
- name: Configure proxmox backups
  hosts: smith
  roles:
    - common
  vars:
    backup_storage_id: "pbs-backups-vm"
    backup_job_id: "pbs-backup"
    # Fleecing: without it, every guest write to a not-yet-copied block waits
    # for that block's upload to PBS (copy-before-write). monitoring-stack's
    # ~1h nightly backup saturated its disk (load 117, Grafana SQLite locks,
    # OTel ingest refused; 2026-10-12). Fleecing parks the old blocks in a
    # temporary image instead. ceph-vm-disks: shared by every node and TBs
    # free; node-local thin pools (niobe local-lvm ~88G free) risk filling and
    # pausing every guest on them.
    backup_job_options:
      storage: "{{ backup_storage_id }}"
      schedule: "02:00"
      all: 1
      # Mapping because pvesh returns it parsed; rendered as k=v,... for the CLI.
      fleecing: { enabled: 1, storage: ceph-vm-disks }
    backup_job_args: >-
      {% for key, value in backup_job_options.items() %} --{{ key }}
      "{{ value.items() | map('join', '=') | join(',') if value is mapping else value }}"{% endfor %}
    # Talos VMs run the QEMU guest agent, so vzdump issues fs-freeze/fs-thaw
    # during snapshot backups. Freezing the filesystem under etcd blocks its
    # fsyncs (2026-07-31 outage); Talos gains nothing from quiesce, so disable
    # it. The bpg tofu provider has no field for this agent sub-option, hence
    # it is enforced here.
    talos_vm_keys:
      - talos_trinity
      - talos_neo
      - talos_niobe
      - talos_smith
  tasks:
    - name: Get certificate information
      delegate_to: backup-stack
      command: proxmox-backup-manager cert info
      register: pbs_cert_info
      changed_when: false # This command doesn't change state
      check_mode: false # Always run this command even in check mode

    - name: Extract SHA256 fingerprint line
      set_fact:
        fingerprint_line: "{{ pbs_cert_info.stdout_lines | select('match', '^Fingerprint \\(sha256\\):') | first }}"
      failed_when: fingerprint_line is not defined or fingerprint_line == "" # Ensure the line was found

    - name: Extract fingerprint value
      set_fact:
        pbs_fingerprint: "{{ fingerprint_line | regex_replace('^Fingerprint \\(sha256\\):\\s*(.*)$', '\\1') }}"

    - name: Check if {{backup_storage_id}} storage is added to proxmox
      command: pvesm status --storage {{backup_storage_id}}
      register: storage_status
      ignore_errors: yes
      changed_when: false

    - name: Add {{backup_storage_id}} storage to proxmox if not exists
      command: >
        pvesm add pbs {{backup_storage_id}}
        --datastore backups-vm
        --server {{vm.backup_stack.ip}}
        --content backup
        --username root@pam
        --password {{tf_outputs.home_backup_stack_password.value}}
        --fingerprint {{pbs_fingerprint}}
      when: storage_status.rc != 0

    - name: Read vm backup job
      command: pvesh get /cluster/backup/{{ backup_job_id }} --output-format json
      register: backup_job
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Create backup job
      command: pvesh create /cluster/backup/ --id {{ backup_job_id }} {{ backup_job_args }}
      when: backup_job.rc != 0

    - name: Converge backup job options
      command: pvesh set /cluster/backup/{{ backup_job_id }} {{ backup_job_args }}
      when:
        - backup_job.rc == 0
        - (backup_job.stdout | from_json | combine(backup_job_options)) != (backup_job.stdout | from_json)


    - name: Read Talos VM agent configuration
      command: pvesh get /nodes/{{ vm[item].node }}/qemu/{{ vm[item].id }}/config --output-format json
      loop: "{{ talos_vm_keys }}"
      register: talos_vm_configs
      changed_when: false
      check_mode: false

    - name: Disable QGA fs-freeze during backups on Talos VMs
      command: >
        pvesh set /nodes/{{ vm[item.item].node }}/qemu/{{ vm[item.item].id }}/config
        --agent "{{ (item.stdout | from_json).agent }},freeze-fs-on-backup=0"
      loop: "{{ talos_vm_configs.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: "'freeze-fs-on-backup' not in ((item.stdout | from_json).agent | default(''))"