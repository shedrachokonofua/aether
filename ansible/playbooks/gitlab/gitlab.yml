---
- name: Deploy GitLab
  hosts: gitlab
  gather_facts: true
  tasks:
    - name: Create required directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - ./gitlab/data
        - ./gitlab/logs
        - ./gitlab/config

    - name: Copy gitlab.rb
      template:
        src: gitlab.rb.j2
        dest: ./gitlab/config/gitlab.rb
        mode: "0755"
      tags: [gitlab-config]

    - name: Make ports unprivileged
      sysctl:
        name: net.ipv4.ip_unprivileged_port_start
        value: 0
        state: present
        reload: yes
      become: true

    - name: Create a pod
      containers.podman.podman_pod:
        name: gitlab
        state: quadlet
        ports:
          - "80:80"
          - "2222:22"
          - "3210:3210"
          - "5050:5050"
        restart_policy: on-failure
        recreate: true
        quadlet_options:
          - |
            [Install]
            WantedBy=default.target

    - name: Start GitLab
      containers.podman.podman_container:
        name: gitlab
        state: quadlet
        image: docker.io/gitlab/gitlab-ce:latest
        pull: always
        pod: gitlab.pod
        cap_add:
          - NET_ADMIN
          - NET_BIND_SERVICE
        volumes:
          - /home/aether/gitlab/data:/var/opt/gitlab:Z
          - /home/aether/gitlab/logs:/var/log/gitlab:Z
          - /home/aether/gitlab/config:/etc/gitlab:Z
        env:
          GITLAB_ROOT_EMAIL: "{{ secrets.gitlab.root_email }}"
        # Every start pulls :latest. On 2026-09-22 a host reboot fetched a new
        # image (130s), overran the default start timeout, and with no Restart=
        # GitLab stayed down for 5h. Allow slow pulls and retry failed starts.
        quadlet_options:
          - |
            [Service]
            TimeoutStartSec=900
            Restart=on-failure
            RestartSec=30

    - name: Create user systemd unit directory
      file:
        path: ~/.config/systemd/user
        state: directory
        mode: "0755"
      tags: [registry-cleanup]

    - name: Copy registry cleanup policy script
      copy:
        src: registry-cleanup-policy.rb
        dest: ./gitlab/registry-cleanup-policy.rb
        mode: "0644"
      tags: [registry-cleanup]

    - name: Install registry cleanup policy service and timer
      copy:
        dest: "~/.config/systemd/user/{{ item.name }}"
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: gitlab-registry-cleanup-policy.service
          content: |
            [Unit]
            Description=Apply the container registry cleanup policy to every GitLab project
            After=gitlab.service
            Requires=gitlab.service

            [Service]
            Type=oneshot
            # Fed on stdin: files under the :Z mounts are only relabeled at container start.
            ExecStart=/bin/sh -c 'exec /usr/bin/podman exec -i gitlab gitlab-rails runner - < %h/gitlab/registry-cleanup-policy.rb'
        - name: gitlab-registry-cleanup-policy.timer
          content: |
            [Unit]
            Description=Daily GitLab container registry cleanup policy enforcement

            [Timer]
            OnCalendar=*-*-* 03:00:00
            RandomizedDelaySec=15m
            Persistent=true

            [Install]
            WantedBy=timers.target
      tags: [registry-cleanup]

    - name: Reload systemd
      systemd:
        daemon_reload: yes
        scope: user
      tags: [registry-cleanup]

    - name: Enable registry cleanup policy timer
      systemd:
        name: gitlab-registry-cleanup-policy.timer
        state: started
        enabled: true
        scope: user
      tags: [registry-cleanup]

    - name: Start GitLab quadlet
      systemd:
        name: gitlab-pod
        state: restarted
        scope: user
      tags: [gitlab-restart]
