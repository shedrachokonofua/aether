---
- name: Register LiteLLM virtual keys
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    litellm_url: "{{ lookup('env', 'LITELLM_URL') | default('https://litellm.home.shdr.ch', true) }}"
    litellm_key_models:
      - all-team-models
    litellm_key_user_id: default_user_id
    litellm_key_models_by_alias:
      holmes:
        - router/glm-5.3
        - zai/glm-5.3
        - ollama-cloud/glm-5.3
        - zai/glm-5.3-flash
        - router/glm-5.3-flash

        - aether/qwen3.6-35b-a3b:think
        - aether/qwen3.8-flash-next:think
        - aether/qwen3.8-27b:think
        - qwen-cloud/qwen3.8-max
      omp: &omp_models
        - antigravity/gemini-3.8-flash
        - antigravity/gemini-4-argon
        - supergrok/grok-4.7
        - step/step-5-preview
        - chatgpt/gpt-6-astra
        - chatgpt/gpt-6.1-sol
        - chatgpt/gpt-6-luna
        - router/glm-5.3
        - zai/glm-5.3
        - ollama-cloud/glm-5.3
        - commandcode/glm-5.3-flash
        - ollama-cloud/glm-5.3-flash
        - opencode-go/glm-5.3-flash
        - zai/glm-5.3-flash
        - clinepass/glm-5.3-flash
        - router/glm-5.3-flash
        - clinepass/hy4-preview
        - commandcode/hy4-preview
        - opencode-go/hy4-preview
        - router/hy4-preview
        - commandcode/muse-spark-1.3-contributor
        - meta/muse-spark-1.3-contributor
        - meta/muse-wonder-1.0-contributor
        - meta/muse-wonder-full-1.0-contributor
        - clinepass/muse-spark-1.3-contributor
        - router/muse-spark-1.3-contributor
        - router/mimo-v2.6-pro
        - xiaomi/mimo-v2.6-pro
        - commandcode/mimo-v2.6-pro
        - opencode-go/mimo-v2.6-pro
        - router/mimo-v2.6-flash
        - xiaomi/mimo-v2.6-flash
        - commandcode/mimo-v2.6-flash
        - opencode-go/mimo-v2.6-flash
        - aether/qwen3.5-9b
        - aether/qwen3.5-9b:think
        - aether/qwen3.8-flash-next
        - aether/qwen3.8-flash-next:code
        - aether/qwen3.8-flash-next:think
        - aether/qwen3.8-flash-next:xhigh
        - aether/qwen3.8-27b
        - aether/qwen3.8-27b:code
        - aether/qwen3.8-27b:think
        - aether/qwen3.6-35b-a3b
        - aether/qwen3.6-35b-a3b:code
        - aether/qwen3.6-35b-a3b:think
        - aether/muse-glimmer-30b
        - aether/muse-glimmer-30b:think
        - clinepass/qwen3.8-max
        - qwen-cloud/qwen3.8-max
        - qwen-cloud/qwen3.8-flash
        - kimi/k3
        - router/deepseek-v4-pro
        - ollama-cloud/deepseek-v4-pro
        - ollama-cloud/deepseek-v4.1-flash
        - router/minimax-m3
        - moira/frontier
        - moira/strong
        - claude/sonnet-5-5
        - claude/opus-5-5
        - claude/fable-5-1
        - claude/haiku-5-5
        - moira/flash
        - moira/cyber
        - router/ling-3.1-flash
        - openrouter/ling-3.1-flash
        - commandcode-free/ling-3.1-flash
        - routeway/glm-5.3-flash-uncensored
      # omp on the Coder workspace: same allowlist as the workstation omp, its
      # own key so its traffic is attributable (it ran on the master key).
      omp_coder: *omp_models
      colony:
        - antigravity/gemini-3.8-flash
        - supergrok/grok-4.7
        - step/step-5-preview
        - chatgpt/gpt-6-astra
        - chatgpt/gpt-6.1-sol
        - chatgpt/gpt-6-luna
        - router/glm-5.3
        - zai/glm-5.3
        - ollama-cloud/glm-5.3
        - commandcode/glm-5.3-flash
        - ollama-cloud/glm-5.3-flash
        - opencode-go/glm-5.3-flash
        - zai/glm-5.3-flash
        - clinepass/glm-5.3-flash
        - router/glm-5.3-flash
        - clinepass/hy4-preview
        - commandcode/hy4-preview
        - opencode-go/hy4-preview
        - codebuddy/hy4-preview
        - router/hy4-preview
        - commandcode/muse-spark-1.3-contributor
        - meta/muse-spark-1.3-contributor
        - meta/muse-wonder-1.0-contributor
        - meta/muse-wonder-full-1.0-contributor
        - clinepass/muse-spark-1.3-contributor
        - router/muse-spark-1.3-contributor
        - router/mimo-v2.6-pro
        - xiaomi/mimo-v2.6-pro
        - commandcode/mimo-v2.6-pro
        - opencode-go/mimo-v2.6-pro
        - router/mimo-v2.6-flash
        - xiaomi/mimo-v2.6-flash
        - commandcode/mimo-v2.6-flash
        - opencode-go/mimo-v2.6-flash
        - kimi/k3
        - router/deepseek-v4-pro
        - ollama-cloud/deepseek-v4-pro
        - ollama-cloud/deepseek-v4.1-flash
        - qwen-cloud/qwen3.8-max
        - qwen-cloud/qwen3.8-flash
        - clinepass/qwen3.8-max
        - aether/qwen3.8-flash-next
        - aether/qwen3.8-27b
        - moira/frontier
        - moira/strong
        - moira/flash
        - moira/cyber
        - router/ling-3.1-flash
        - openrouter/ling-3.1-flash
        - commandcode-free/ling-3.1-flash
        - claude/haiku-5-5
      frame_gallery:
        # Local default model for diverse art direction and concrete composition.
        - aether/qwen3.8-flash-next
        - aether/qwen3.8-27b

      deskplane_mcp:
        # Moira group (tiers.yaml): sol -> gemini-3.8-flash -> qwen3.8-flash-next.
        - moira/computer-use
        - chatgpt/gpt-6.1-sol
        - antigravity/gemini-3.8-flash
        - aether/qwen3.8-flash-next
        - aether/qwen3.8-27b
        - aether/qwen3.6-35b-a3b
        - aether/gemma-4-31b
        - qwen-cloud/qwen3.8-max
    # OpenWebUI's native MCP client sees only mcp_tool_search + mcp_tool_call
    # instead of every gateway tool (328 tools, ~73.6k schema tokens per chat
    # on 2026-10-04, vs ~210). Search only covers servers listed here, so this
    # must track litellm_config.yaml.tftpl's mcp_servers. Works over /mcp/
    # (what OpenWebUI uses); LiteLLM 1.99.1's /mcp-rest search returns [].
    litellm_openwebui_mcp_servers:
      - time
      - finviz
      - affine
      - comfyui
      - colony
      # oauth_delegate: tools run as the OpenWebUI user's forwarded token.
      - pop
      # oauth2_token_exchange: tools run as the user via a Keycloak-exchanged
      # daimyo-audience token (keycloak.tf litellm_mcp_exchange).
      - daimyo
      - espn
      - tmdb
      - jellyfin
      - deskplane
      - siren
      - fm
      - google_maps
    # The seven30-foundry key was created through the LiteLLM API (its value is
    # not in SOPS), so it is found by alias and updated by its hashed token.
    # Foundry's agents send the same list in x-mcp-servers; the key permission is
    # the boundary (2026-09-26: firecrawl + finviz; 2026-10-10: + deskplane, the
    # browser-backed search/scrape/parse server, for research; 2026-10-14:
    # firecrawl retired — deskplane is the only web data server).
    litellm_seven30_foundry_alias: seven30-foundry
    litellm_seven30_foundry_mcp_servers:
      - deskplane
      - finviz
    # The `orion` Daimyo agent's gateway key: its value is in OpenBao
    # (orgs/personal/litellm-mcp, tofu/home/openbao_daimyo.tf), not SOPS, so it
    # is found by alias. MCP only (no models); the server list must track
    # Orion chart values agents.orion.spec.grants (deploy/helm/orion), plus
    # dev's retained ClickStack grant in tofu/home/kubernetes/orion_agent_tools.tf.
    litellm_daimyo_orion_alias: daimyo-orion
    litellm_daimyo_orion_mcp_servers:
      - colony
      - clickstack
      - affine
      - siren
      - jellyfin
      - comfyui
      - espn
      - finviz
      - fm
      - google_maps
      - time
      - tmdb
      - instacart

  tasks:
    - name: Load secrets
      tags: [orion-mcp]
      community.sops.load_vars:
        file: "{{ aether_root }}/secrets/secrets.yml"
        name: secrets

    - name: Check LiteLLM key inputs
      tags: [orion-mcp]
      ansible.builtin.assert:
        that:
          - secrets.litellm.master_key is defined
          - secrets.litellm.virtual_keys is defined
          - secrets.litellm.virtual_keys | length > 0
        fail_msg: "secrets.litellm.master_key and secrets.litellm.virtual_keys are required"

    - name: Wait for LiteLLM API
      tags: [orion-mcp]
      ansible.builtin.uri:
        url: "{{ litellm_url }}/health/liveliness"
        method: GET
        status_code: [200]
      register: litellm_health
      retries: 12
      delay: 5
      until: litellm_health.status == 200

    - name: Check if virtual keys exist by alias
      ansible.builtin.uri:
        url: "{{ litellm_url }}/key/list?key_alias={{ item.key }}"
        method: GET
        headers:
          Authorization: "Bearer {{ secrets.litellm.master_key }}"
        status_code: [200]
        return_content: true
      register: litellm_key_check
      loop: "{{ secrets.litellm.virtual_keys | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    - name: Build existing alias list
      ansible.builtin.set_fact:
        litellm_existing_aliases: "{{ (litellm_existing_aliases | default([])) + [item.item.key] }}"
      loop: "{{ litellm_key_check.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: item.json.total_count | default(0) | int > 0

    - name: Build missing alias list
      ansible.builtin.set_fact:
        litellm_missing_aliases: "{{ (litellm_missing_aliases | default([])) + [item.item.key] }}"
      loop: "{{ litellm_key_check.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: item.json.total_count | default(0) | int == 0

    - name: Create missing virtual keys
      ansible.builtin.uri:
        url: "{{ litellm_url }}/key/generate"
        method: POST
        headers:
          Authorization: "Bearer {{ secrets.litellm.master_key }}"
          Content-Type: application/json
        body_format: json
        body:
          key: "{{ item.item.value }}"
          key_alias: "{{ item.item.key }}"
          models: "{{ litellm_key_models_by_alias[item.item.key] | default(litellm_key_models) }}"
          user_id: "{{ litellm_key_user_id }}"
        status_code: [200]
      loop: "{{ litellm_key_check.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: item.json.total_count | default(0) | int == 0
      no_log: true

    - name: Synchronize Holmes virtual-key model allowlist
      ansible.builtin.uri:
        url: "{{ litellm_url }}/key/update"
        method: POST
        headers:
          Authorization: "Bearer {{ secrets.litellm.master_key }}"
          Content-Type: application/json
        body_format: json
        body:
          key: "{{ secrets.litellm.virtual_keys.holmes }}"
          models: "{{ litellm_key_models_by_alias.holmes }}"
        status_code: [200]
      no_log: true

    - name: Synchronize omp virtual-key model allowlist
      ansible.builtin.uri:
        url: "{{ litellm_url }}/key/update"
        method: POST
        headers:
          Authorization: "Bearer {{ secrets.litellm.master_key }}"
          Content-Type: application/json
        body_format: json
        body:
          key: "{{ secrets.litellm.virtual_keys.omp }}"
          models: "{{ litellm_key_models_by_alias.omp }}"
        status_code: [200]
      no_log: true

    - name: Synchronize omp_coder virtual-key model allowlist
      ansible.builtin.uri:
        url: "{{ litellm_url }}/key/update"
        method: POST
        headers:
          Authorization: "Bearer {{ secrets.litellm.master_key }}"
          Content-Type: application/json
        body_format: json
        body:
          key: "{{ secrets.litellm.virtual_keys.omp_coder }}"
          models: "{{ litellm_key_models_by_alias.omp_coder }}"
        status_code: [200]
      no_log: true

    - name: Synchronize deskplane_mcp virtual-key model allowlist
      ansible.builtin.uri:
        url: "{{ litellm_url }}/key/update"
        method: POST
        headers:
          Authorization: "Bearer {{ secrets.litellm.master_key }}"
          Content-Type: application/json
        body_format: json
        body:
          key: "{{ secrets.litellm.virtual_keys.deskplane_mcp }}"
          models: "{{ litellm_key_models_by_alias.deskplane_mcp }}"
        status_code: [200]
      no_log: true

    - name: Synchronize colony virtual-key model allowlist
      ansible.builtin.uri:
        url: "{{ litellm_url }}/key/update"
        method: POST
        headers:
          Authorization: "Bearer {{ secrets.litellm.master_key }}"
          Content-Type: application/json
        body_format: json
        body:
          key: "{{ secrets.litellm.virtual_keys.colony }}"
          models: "{{ litellm_key_models_by_alias.colony }}"
        status_code: [200]
      no_log: true

    - name: Synchronize frame_gallery virtual-key model allowlist
      ansible.builtin.uri:
        url: "{{ litellm_url }}/key/update"
        method: POST
        headers:
          Authorization: "Bearer {{ secrets.litellm.master_key }}"
          Content-Type: application/json
        body_format: json
        body:
          key: "{{ secrets.litellm.virtual_keys.frame_gallery }}"
          models: "{{ litellm_key_models_by_alias.frame_gallery }}"
        status_code: [200]
      no_log: true

    - name: Enable MCP tool search on the openwebui virtual key
      ansible.builtin.uri:
        url: "{{ litellm_url }}/key/update"
        method: POST
        headers:
          Authorization: "Bearer {{ secrets.litellm.master_key }}"
          Content-Type: application/json
        body_format: json
        body:
          key: "{{ secrets.litellm.virtual_keys.openwebui }}"
          object_permission:
            mcp_tool_search_enabled: true
            mcp_servers: "{{ litellm_openwebui_mcp_servers }}"
        status_code: [200]
      no_log: true

    - name: Look up the seven30-foundry virtual key by alias
      ansible.builtin.uri:
        url: "{{ litellm_url }}/key/list?key_alias={{ litellm_seven30_foundry_alias }}&return_full_object=true"
        method: GET
        headers:
          Authorization: "Bearer {{ secrets.litellm.master_key }}"
        status_code: [200]
        return_content: true
      register: litellm_seven30_foundry_key
      no_log: true

    - name: Check the seven30-foundry key is unique
      ansible.builtin.assert:
        that:
          - litellm_seven30_foundry_key.json['keys'] | length == 1
        fail_msg: "expected exactly one LiteLLM key with alias {{ litellm_seven30_foundry_alias }}"

    - name: Scope the seven30-foundry virtual key to its MCP servers
      ansible.builtin.uri:
        url: "{{ litellm_url }}/key/update"
        method: POST
        headers:
          Authorization: "Bearer {{ secrets.litellm.master_key }}"
          Content-Type: application/json
        body_format: json
        body:
          key: "{{ litellm_seven30_foundry_key.json['keys'][0].token }}"
          object_permission:
            mcp_servers: "{{ litellm_seven30_foundry_mcp_servers }}"
        status_code: [200]
      no_log: true

    - name: Look up the daimyo-orion virtual key by alias
      tags: [orion-mcp]
      ansible.builtin.uri:
        url: "{{ litellm_url }}/key/list?key_alias={{ litellm_daimyo_orion_alias }}&return_full_object=true"
        method: GET
        headers:
          Authorization: "Bearer {{ secrets.litellm.master_key }}"
        status_code: [200]
        return_content: true
      register: litellm_daimyo_orion_key
      no_log: true

    - name: Check the daimyo-orion key is unique
      tags: [orion-mcp]
      ansible.builtin.assert:
        that:
          - litellm_daimyo_orion_key.json['keys'] | length == 1
        fail_msg: "expected exactly one LiteLLM key with alias {{ litellm_daimyo_orion_alias }}"

    - name: Scope the daimyo-orion virtual key to its MCP servers, without models
      tags: [orion-mcp]
      ansible.builtin.uri:
        url: "{{ litellm_url }}/key/update"
        method: POST
        headers:
          Authorization: "Bearer {{ secrets.litellm.master_key }}"
          Content-Type: application/json
        body_format: json
        body:
          key: "{{ litellm_daimyo_orion_key.json['keys'][0].token }}"
          models: ["no-default-models"]
          object_permission:
            mcp_servers: "{{ litellm_daimyo_orion_mcp_servers }}"
        status_code: [200]
      no_log: true

    # Aliases retired from the cluster. The playbook can create and update keys
    # but nothing else deletes them, so the live keys orphan when their SOPS
    # entries go. Delete by alias, idempotently: an alias with no live key is
    # a no-op, so this is safe to run repeatedly and before the SOPS removal.
    - name: Delete retired virtual keys by alias
      vars:
        litellm_retired_key_aliases:
          - firecrawl
          - hermes_beryl
          - hermes_tungsten
      block:
        - name: Look up retired virtual keys by alias
          ansible.builtin.uri:
            url: "{{ litellm_url }}/key/list?key_alias={{ item }}&return_full_object=true"
            method: GET
            headers:
              Authorization: "Bearer {{ secrets.litellm.master_key }}"
            status_code: [200]
            return_content: true
          register: litellm_retired_key_lookup
          loop: "{{ litellm_retired_key_aliases }}"
          loop_control:
            label: "{{ item }}"
          no_log: true

        - name: Delete live retired virtual keys
          ansible.builtin.uri:
            url: "{{ litellm_url }}/key/delete"
            method: POST
            headers:
              Authorization: "Bearer {{ secrets.litellm.master_key }}"
              Content-Type: application/json
            body_format: json
            body:
              keys: "{{ item.json['keys'] | map(attribute='token') | list }}"
            status_code: [200]
          loop: "{{ litellm_retired_key_lookup.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.json['keys'] | default([]) | length > 0
          no_log: true

        - name: Record deleted aliases
          ansible.builtin.set_fact:
            litellm_deleted_aliases: "{{ (litellm_deleted_aliases | default([])) + [item.item] }}"
          loop: "{{ litellm_retired_key_lookup.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.json['keys'] | default([]) | length > 0

    - name: Report virtual key registration
      ansible.builtin.debug:
        msg:
          litellm_url: "{{ litellm_url }}"
          existing_aliases: "{{ litellm_existing_aliases | default([]) | sort }}"
          created_aliases: "{{ litellm_missing_aliases | default([]) | sort }}"
          deleted_aliases: "{{ litellm_deleted_aliases | default([]) | sort }}"
