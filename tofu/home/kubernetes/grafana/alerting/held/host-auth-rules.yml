# HELD: the three host-* rules, parked until the host log rollout is released.
# Not loaded (grafana.tf reads only alerting/rules/*.yml). To release: run the
# monitoring-stack playbook (creates aether.host_auth_events), then paste this
# block back into rules/infra-security.yml before tetragon-escape-signal.

      # Host-layer detection over journald (replaces the Wazuh rule, which never
      # had agents). These read aether.host_auth_events / host_log_heartbeat,
      # filled at insert time by monitoring_stack/clickhouse/21-host-auth-events.sql.
      # The two login rules arm per host one day after that host's first
      # recorded event, so first contact with a newly shipping host is silent.
      # Private and tailnet sources are compared as /24 so a DHCP renewal on a
      # known network is not a new source; public sources are compared exactly.
      - uid: host-ssh-login-new-source
        title: Host SSH Login From New Source
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              rawSql: |
                SELECT host, user, source, toFloat64(count()) AS value
                FROM (
                  SELECT Host AS host, User AS user, Timestamp,
                         if(isIPv4String(Source),
                                if(isIPAddressInRange(Source, '10.0.0.0/8') OR isIPAddressInRange(Source, '172.16.0.0/12')
                                     OR isIPAddressInRange(Source, '192.168.0.0/16') OR isIPAddressInRange(Source, '100.64.0.0/10'),
                                   concat(IPv4NumToString(bitAnd(IPv4StringToNum(Source), 4294967040)), '/24'),
                                   Source),
                                Source) AS source
                  FROM aether.host_auth_events
                  WHERE Kind = 'ssh_accepted'
                    AND Timestamp > now() - INTERVAL 90 DAY
                )
                GROUP BY host, user, source
                HAVING min(Timestamp) > now() - INTERVAL 30 MINUTE
                   AND host IN (
                     SELECT Host FROM aether.host_auth_events
                     WHERE Kind = 'ssh_accepted'
                       AND Timestamp > now() - INTERVAL 90 DAY
                       AND Timestamp < now() - INTERVAL 1 DAY)
              queryType: sql
              editorType: sql
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
          domain: security
        annotations:
          summary: "SSH login to {{ $labels.host }} as {{ $labels.user }} from new source {{ $labels.source }}"
          description: "An accepted SSH login came from a source not seen for this host and user in the previous 90 days. Query aether.host_auth_events for the session and confirm it was you."

      - uid: host-sudo-unexpected
        title: Host Sudo Unexpected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              rawSql: |
                SELECT host, user, kind, toFloat64(count()) AS value
                FROM (
                  SELECT Host AS host, User AS user, Kind AS kind, Timestamp
                  FROM aether.host_auth_events
                  WHERE Kind IN ('sudo_command', 'sudo_denied')
                    AND Timestamp > now() - INTERVAL 90 DAY
                )
                GROUP BY host, user, kind
                HAVING (kind = 'sudo_denied' AND max(Timestamp) > now() - INTERVAL 30 MINUTE)
                    OR (kind = 'sudo_command'
                        AND min(Timestamp) > now() - INTERVAL 30 MINUTE
                        AND host IN (
                          SELECT Host FROM aether.host_auth_events
                          WHERE Kind = 'sudo_command'
                            AND Timestamp > now() - INTERVAL 90 DAY
                            AND Timestamp < now() - INTERVAL 1 DAY))
              queryType: sql
              editorType: sql
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
          domain: security
        annotations:
          summary: "Unexpected sudo on {{ $labels.host }} by {{ $labels.user }} ({{ $labels.kind }})"
          description: "Either sudo was denied (wrong password or not in sudoers), or a user ran sudo on this host for the first time in 90 days. See Detail in aether.host_auth_events for the command."

      - uid: host-logs-absent
        title: Host Logs Absent
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              rawSql: |
                SELECT host, toFloat64(dateDiff('hour', last_seen, now())) AS value
                FROM (
                  SELECT Host AS host, max(Hour) AS last_seen
                  FROM aether.host_log_heartbeat
                  WHERE Hour > now() - INTERVAL 30 DAY
                  GROUP BY host
                )
                WHERE last_seen < now() - INTERVAL 24 HOUR
              queryType: sql
              editorType: sql
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
          domain: security
        annotations:
          summary: "{{ $labels.host }} has shipped no logs for {{ $values.B.Value }}h"
          description: "This host shipped logs within the last 30 days but none in the last 24 hours. Its agent may still send metrics; check the collector's journald receiver on the host."

