        intervalMs: 1000
        maxDataPoints: 43200
        rawSql: "SELECT count() AS value\nFROM otel.otel_logs\nWHERE ServiceName = 'vigil'\n  AND ResourceAttributes['provider'] = 'aws'\n  AND Timestamp > now() - INTERVAL 10 MINUTE\n  AND JSONExtractString(Body, 'event_source') = 'iam.amazonaws.com'\n  AND match(JSONExtractString(Body, 'event_name'), '^(Create|Put|Attach|Detach|Update|Delete)[A-Za-z]+$')"
        queryType: sql
        editorType: sql
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
      domain: security
    annotations:
      summary: AWS IAM Create/Put/Attach/Update/Delete outside review
      description: IAM mutation on users, roles, policies, or OIDC providers. Legit changes come from tofu applies; anything else is an incident.
  - uid: cloud-audit-aws-kms-unseal-key-tamper
    title: AWS KMS Unseal Key Tamper
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: clickhouse
      model:
        datasource:
          type: grafana-clickhouse-datasource
          uid: clickhouse
        format: 1
        intervalMs: 1000
        maxDataPoints: 43200
        rawSql: "SELECT count() AS value\nFROM otel.otel_logs\nWHERE ServiceName = 'vigil'\n  AND ResourceAttributes['provider'] = 'aws'\n  AND Timestamp > now() - INTERVAL 10 MINUTE\n  AND position(Body, '3ab7209d-870a-42b4-a201-8fca65538c6a') > 0\n  AND (JSONExtractString(Body, 'event_name') IN ('ScheduleKeyDeletion', 'DisableKey', 'PutKeyPolicy', 'UpdateKeyDescription', 'RevokeGrant', 'CreateGrant')\n       OR (JSONExtractString(Body, 'event_name') = 'Decrypt' AND JSONExtractString(Body, 'outcome') = 'failure'))"
        queryType: sql
        editorType: sql
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
      domain: security
    annotations:
      summary: openbao-auto-unseal KMS key tamper or denied Decrypt
      description: "Key-policy/schedule-deletion/disable/grant change or a failed Decrypt on the openbao-auto-unseal key (3ab7209d-\u2026). This is a crown-jewel key."
