# =============================================================================
# Cloud-audit (vigil) alerting
# =============================================================================
# All rules ship severity=warning under soak-then-promote (PLAN.md §8):
# 14 days clean, then a single reviewed commit flips the page-class rules to
# critical. The emitted-data contract these match against is
# vigil/docs/schema.md — envelopes, not `raw`.
#
# ClickHouse port: vigil audit events land in otel.otel_logs with
# ServiceName='vigil' and ResourceAttributes['provider'|'collector'|'domain']
# (the former Loki indexed labels); envelope fields event_source/event_name/
# outcome and raw.* live in the JSON Body and are extracted with
# JSONExtractString(Body, ...) — never as selectors. Pod stdout (loop
# heartbeat) is ServiceName LIKE 'cloud-audit/vigil%'. vigil_* gauges keep
# their Prometheus names in otel.otel_metrics_gauge; the activity-driven
# vigil_aws_* series are derived as vigil.aws.* (unverified-live).
#
# Not shipped (per PLAN):
# - any-mutation-outside-apply-window: needs the tofu-apply marker signal
#   (continuous-deployment Phase 0); ship disabled later, don't invent it.

apiVersion: 1
groups:
- orgId: 1
  name: Cloud Audit
  folder: Security
  interval: 1m
  rules:
  - uid: cloud-audit-run-failed
    title: Cloud Audit Collector Run Failed
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: clickhouse
      model:
        datasource:
          type: grafana-clickhouse-datasource
          uid: clickhouse
        format: 1
        intervalMs: 1000
        maxDataPoints: 43200
        rawSql: 'SELECT Attributes[''collector''] AS collector, Attributes[''provider''] AS provider, 1 - argMax(Value, TimeUnix) AS value

          FROM otel.otel_metrics_gauge

          WHERE MetricName = ''vigil_collector_run_ok'' AND TimeUnix > now() - INTERVAL 5 MINUTE

          GROUP BY collector, provider

          HAVING value > 0'
        queryType: sql
        editorType: sql
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: warning
      domain: security
    annotations:
      summary: vigil collector {{ $labels.collector }} last run failed
      description: The last run of {{ $labels.collector }} (provider {{ $labels.provider }}) reported run_ok=0. Check the vigil pod logs in cloud-audit.
  - uid: cloud-audit-feed-absent-5min
    title: Cloud Audit Feed Absent (5m cadence)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 7200
        to: 0
      datasourceUid: clickhouse
      model:
        datasource:
          type: grafana-clickhouse-datasource
          uid: clickhouse
        format: 1
        intervalMs: 1000
        maxDataPoints: 43200
        # Keep healthy rows: an empty table would trigger noDataState=Alerting.
        rawSql: |
          SELECT Attributes['collector'] AS collector, Attributes['provider'] AS provider,
                 if(toUnixTimestamp(now()) - max(Value) > 1800, 1, 0) AS value
          FROM otel.otel_metrics_gauge
          WHERE MetricName = 'vigil_collector_last_success_timestamp_seconds'
            AND Attributes['kind'] != 'snapshot'
            AND TimeUnix > now() - INTERVAL 2 HOUR
          GROUP BY collector, provider
        queryType: sql
        editorType: sql
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    labels:
      severity: warning
      domain: security
    annotations:
      summary: vigil collector {{ $labels.collector }} silent >30m
      description: No successful collect from {{ $labels.collector }} in over 30 minutes. The push-gauge may also have gone Prometheus-stale; check the pod first, then this rule's max_over_time wrapper.
  - uid: cloud-audit-feed-absent-daily
    title: Cloud Audit Feed Absent (daily cadence)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 93600
        to: 0
      datasourceUid: clickhouse
      model:
        datasource:
          type: grafana-clickhouse-datasource
          uid: clickhouse
        format: 1
        intervalMs: 1000
        maxDataPoints: 43200
        # Unseen collectors have no series, as in PromQL; historical samples
        # must be backfilled when moving the daily feed to a new telemetry store.
        rawSql: |
          SELECT Attributes['collector'] AS collector, Attributes['provider'] AS provider,
                 if(toUnixTimestamp(now()) - max(Value) > 93600, 1, 0) AS value
          FROM otel.otel_metrics_gauge
          WHERE MetricName = 'vigil_collector_last_success_timestamp_seconds'
            AND Attributes['kind'] = 'snapshot'
            AND TimeUnix > now() - INTERVAL 26 HOUR
          GROUP BY collector, provider
        queryType: sql
        editorType: sql
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    labels:
      severity: warning
      domain: security
    annotations:
      summary: vigil snapshot collector {{ $labels.collector }} silent >26h
      description: No successful collect from {{ $labels.collector }} in over 26 hours.
  - uid: cloud-audit-loop-absent
    title: Cloud Audit Loop Absent
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: clickhouse
      model:
        datasource:
          type: grafana-clickhouse-datasource
          uid: clickhouse
        format: 1
        intervalMs: 1000
        maxDataPoints: 43200
        rawSql: "SELECT count() AS value\nFROM otel.otel_logs\nWHERE ServiceName LIKE 'cloud-audit/vigil%'\n  AND Timestamp > now() - INTERVAL 6 MINUTE\n  AND positionCaseInsensitive(Body, 'iteration complete') > 0\nHAVING count() > 0"
        queryType: sql
        editorType: sql
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    labels:
      severity: warning
      domain: security
    annotations:
      summary: vigil orchestrator loop silent >6m
      description: No 'iteration complete' stdout line in 6m (~1/min expected). Catches a hung process and pod death ~9m ahead of k8s-replicaset-not-ready; the feed-absent rules cover per-collector staleness.
  - uid: cloud-audit-aws-root-or-console-login
    title: AWS Root or No-MFA Console Login
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: clickhouse
      model:
        datasource:
          type: grafana-clickhouse-datasource
          uid: clickhouse
        format: 1
        intervalMs: 1000
        maxDataPoints: 43200
        rawSql: "SELECT count() AS value\nFROM otel.otel_logs\nWHERE ServiceName = 'vigil'\n  AND ResourceAttributes['provider'] = 'aws'\n  AND Timestamp > now() - INTERVAL 10 MINUTE\n  AND positionCaseInsensitive(Body, 'ConsoleLogin') > 0\n  AND (JSONExtractString(Body, 'raw', 'userIdentity', 'type') = 'Root'\n       OR JSONExtractString(Body, 'raw', 'additionalEventData', 'MFAUsed') = 'No')"
        queryType: sql
        editorType: sql
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
      domain: security
    annotations:
      summary: AWS console login as root or without MFA
      description: "CloudTrail saw a ConsoleLogin with userIdentity.type=Root or MFAUsed=No. Base rate of legit occurrences \u2248 0 in this estate."
  - uid: cloud-audit-aws-iam-mutation
    title: AWS IAM Mutation
    condition: C
