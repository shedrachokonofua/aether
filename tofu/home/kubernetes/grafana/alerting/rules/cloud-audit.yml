  - uid: cloud-audit-aws-analyzer-finding
    title: AWS Access Analyzer Active Finding
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 86400
        to: 0
      datasourceUid: clickhouse
      model:
        datasource:
          type: grafana-clickhouse-datasource
          uid: clickhouse
        format: 1
        intervalMs: 1000
        maxDataPoints: 43200
        rawSql: "SELECT Attributes['analyzer'] AS analyzer, sum(inc) AS value\nFROM (\n  SELECT Attributes, ResourceAttributes, ServiceName, StartTimeUnix,\n         deltaSumTimestamp(Value, toUnixTimestamp64Nano(TimeUnix)) AS inc\n  FROM otel.otel_metrics_sum\n  WHERE MetricName = 'vigil.aws.access_analyzer.findings'\n    AND Attributes['status'] = 'active'\n    AND TimeUnix > now() - INTERVAL 1 DAY\n  GROUP BY Attributes, ResourceAttributes, ServiceName, StartTimeUnix\n)\nGROUP BY analyzer\nHAVING value > 0"
        queryType: sql
        editorType: sql
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
      domain: security
    annotations:
      summary: New active IAM Access Analyzer finding ({{ $labels.analyzer }})
      description: Daily snapshot shows an increase in active findings. Review the analyzer in the AWS console.
  - uid: cloud-audit-aws-ses-reputation
    title: AWS SES Reputation Threshold
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 86400
        to: 0
      datasourceUid: clickhouse
      model:
        datasource:
          type: grafana-clickhouse-datasource
          uid: clickhouse
        format: 1
        intervalMs: 1000
        maxDataPoints: 43200
        rawSql: "SELECT metric, value FROM (\n  SELECT 'bounce_rate' AS metric, argMax(Value, TimeUnix) AS value\n  FROM otel.otel_metrics_gauge\n  WHERE MetricName = 'vigil.aws.ses.bounce_rate' AND TimeUnix > now() - INTERVAL 5 MINUTE\n  UNION ALL\n  SELECT 'complaint_rate' AS metric, argMax(Value, TimeUnix) AS value\n  FROM otel.otel_metrics_gauge\n  WHERE MetricName = 'vigil.aws.ses.complaint_rate' AND TimeUnix > now() - INTERVAL 5 MINUTE\n)\nWHERE (metric = 'bounce_rate' AND value > 0.05) OR (metric = 'complaint_rate' AND value > 0.001)"
        queryType: sql
        editorType: sql
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
      domain: security
    annotations:
      summary: SES bounce/complaint rate over threshold
      description: "Bounce rate >5% or complaint rate >0.1% in the trailing 24h \u2014 deliverability risk for the estate's mail."
