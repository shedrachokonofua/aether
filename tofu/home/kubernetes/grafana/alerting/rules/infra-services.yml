          description: "The timer-backed backup certificate renewal path is not scheduled."

      # Kubernetes cert-manager provides its own lifecycle timestamps. Use its
      # renewal deadline rather than a fixed 30% threshold because the cluster
      # has both long-lived application certificates and one-hour Istio certs.
      - uid: k8s-cert-renewal-overdue
        title: Kubernetes certificate renewal overdue
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawSql: |
                SELECT namespace, name, issuer_group, issuer_kind, issuer_name, 1 AS value
                FROM (
                  SELECT Attributes['namespace'] AS namespace, Attributes['name'] AS name, Attributes['issuer_group'] AS issuer_group, Attributes['issuer_kind'] AS issuer_kind, Attributes['issuer_name'] AS issuer_name, argMax(Value, TimeUnix) AS ts FROM otel.otel_metrics_gauge WHERE MetricName = 'certmanager_certificate_renewal_timestamp_seconds' AND TimeUnix > now() - INTERVAL 5 MINUTE GROUP BY namespace, name, issuer_group, issuer_kind, issuer_name
                ) AS t
                INNER JOIN (
                  SELECT Attributes['namespace'] AS namespace, Attributes['name'] AS name, Attributes['issuer_group'] AS issuer_group, Attributes['issuer_kind'] AS issuer_kind, Attributes['issuer_name'] AS issuer_name, argMax(Value, TimeUnix) AS ready FROM otel.otel_metrics_gauge WHERE MetricName = 'certmanager_certificate_ready_status' AND TimeUnix > now() - INTERVAL 5 MINUTE AND Attributes['condition'] = 'True' GROUP BY namespace, name, issuer_group, issuer_kind, issuer_name
                ) AS r ON t.namespace = r.namespace AND t.name = r.name AND t.issuer_group = r.issuer_group AND t.issuer_kind = r.issuer_kind AND t.issuer_name = r.issuer_name
                WHERE t.ts - toUnixTimestamp(now()) < 0 AND r.ready = 0
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
          channel: digest
        annotations:
          summary: "Kubernetes certificate {{ $labels.namespace }}/{{ $labels.name }} renewal is overdue"
          description: "cert-manager has passed its renewal timestamp without a Ready certificate."

      - uid: k8s-cert-expiring-critical
        title: Kubernetes certificate near expiry
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawSql: |
                SELECT namespace, name, issuer_group, issuer_kind, issuer_name, 1 AS value
                FROM (
                  SELECT Attributes['namespace'] AS namespace, Attributes['name'] AS name, Attributes['issuer_group'] AS issuer_group, Attributes['issuer_kind'] AS issuer_kind, Attributes['issuer_name'] AS issuer_name, argMax(Value, TimeUnix) AS ts FROM otel.otel_metrics_gauge WHERE MetricName = 'certmanager_certificate_expiration_timestamp_seconds' AND TimeUnix > now() - INTERVAL 5 MINUTE GROUP BY namespace, name, issuer_group, issuer_kind, issuer_name
                ) AS t
                INNER JOIN (
                  SELECT Attributes['namespace'] AS namespace, Attributes['name'] AS name, Attributes['issuer_group'] AS issuer_group, Attributes['issuer_kind'] AS issuer_kind, Attributes['issuer_name'] AS issuer_name, argMax(Value, TimeUnix) AS ready FROM otel.otel_metrics_gauge WHERE MetricName = 'certmanager_certificate_ready_status' AND TimeUnix > now() - INTERVAL 5 MINUTE AND Attributes['condition'] = 'True' GROUP BY namespace, name, issuer_group, issuer_kind, issuer_name
                ) AS r ON t.namespace = r.namespace AND t.name = r.name AND t.issuer_group = r.issuer_group AND t.issuer_kind = r.issuer_kind AND t.issuer_name = r.issuer_name
                WHERE t.ts - toUnixTimestamp(now()) < 3600 AND r.ready = 0
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
          channel: page
        annotations:
          summary: "Kubernetes certificate {{ $labels.namespace }}/{{ $labels.name }} expires within one hour"
          description: "cert-manager has not produced a Ready replacement before the certificate's NotAfter."
      # =====================================================================
      # Jellyfin — UX / auth / debrid-link observability
      # =====================================================================

      - uid: jellyfin-gelato-stream-failures
        title: Jellyfin Gelato Stream Resolution Failures
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawSql: |
                SELECT count() AS value
                FROM otel.otel_logs
                WHERE Timestamp > now() - INTERVAL 1 HOUR
                  AND ResourceAttributes['k8s.namespace.name'] = 'jellyfin'
                  AND positionCaseInsensitive(Body, 'Invalid stream, skipping') > 0
                HAVING count() > 0
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
              refId: C
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: warning
          domain: media
        annotations:
          summary: "Jellyfin Gelato debrid providers are failing"
          description: "{{ $values.B.Value }} Invalid stream skipping events in the last hour — debrid provider rot (torrentio/mediafusion/comet/premiumize). Playback attempts fail before transcoding starts."

      - uid: jellyfin-gelato-no-streams
        title: Jellyfin Click-Play-No-Streams
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawSql: |
                SELECT count() AS value
                FROM otel.otel_logs
                WHERE Timestamp > now() - INTERVAL 1 HOUR
                  AND ResourceAttributes['k8s.namespace.name'] = 'jellyfin'
                  AND match(Body, 'SyncStreams finished .* streams=0')
                HAVING count() > 0
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: warning
          domain: media
        annotations:
          summary: "Jellyfin playback attempts returning zero usable streams"
          description: "{{ $values.B.Value }} SyncStreams results returned zero streams in the last hour. Users click play and nothing happens — worst-case UX with no error surfaced."

      - uid: jellyfin-down
        title: Jellyfin Server Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawSql: |
                SELECT argMax(Value, TimeUnix) AS value
                FROM otel.otel_metrics_gauge
                WHERE MetricName = 'jellyfin_up'
                  AND TimeUnix > now() - INTERVAL 5 MINUTE
                HAVING count() > 0
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: Alerting
        execErrState: OK
        for: 5m
        labels:
          severity: critical
          domain: media
        annotations:
          summary: "Jellyfin exporter reports server unreachable"
          description: "jellyfin_up has been 0 for 5 minutes. The exporter cannot reach the Jellyfin API — either the server is down or the API key is invalid."

