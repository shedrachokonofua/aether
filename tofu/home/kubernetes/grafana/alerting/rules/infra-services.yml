                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawSql: |
                SELECT Attributes['host_name'] AS host_name, Attributes['filepath'] AS filepath,
                       ResourceAttributes['service.instance.id'] AS instance,
                       Attributes['serial_number'] AS serial_number, Attributes['subject_CN'] AS subject_CN,
                       argMax(Value, TimeUnix) AS value
                FROM otel.otel_metrics_gauge
                WHERE MetricName = 'x509_cert_expired'
                  AND TimeUnix > now() - INTERVAL 5 MINUTE
                GROUP BY Attributes, ResourceAttributes, ServiceName
                HAVING value = 1
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
          channel: page
        annotations:
          summary: "Local certificate {{ $labels.filepath }} is expired"
          description: "A certificate on {{ $labels.host_name }} has passed NotAfter; check its renewal unit and dependent service."

      - uid: x509-renewal-unit-failed
        title: Certificate renewal unit failed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawSql: |
                SELECT Attributes['host_name'] AS host_name, Attributes['name'] AS name, argMax(Value, TimeUnix) AS value
                FROM otel.otel_metrics_gauge
                WHERE MetricName = 'systemd_unit_state'
                  AND TimeUnix > now() - INTERVAL 5 MINUTE
                  AND Attributes['state'] = 'failed'
                  AND match(Attributes['name'], '^(backrest-cert-renew|openbao-cert-renew|step-ca-cert-renew)\\.(service|timer)$')
                GROUP BY host_name, name
                HAVING value = 1
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
          channel: digest
        annotations:
          summary: "Certificate renewal unit {{ $labels.name }} failed on {{ $labels.host_name }}"
          description: "The renewal unit is in systemd failed state. Investigate before the current certificate reaches NotAfter."

      - uid: x509-renewal-daemon-down
        title: Certificate renewal daemon down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: clickhouse
            model:
              datasource:
                type: grafana-clickhouse-datasource
                uid: clickhouse
              editorType: sql
              format: 1
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: sql
              rawSql: |
                SELECT Attributes['host_name'] AS host_name, Attributes['name'] AS name, 1 - argMax(Value, TimeUnix) AS value
                FROM otel.otel_metrics_gauge
                WHERE MetricName = 'systemd_unit_state'
                  AND TimeUnix > now() - INTERVAL 5 MINUTE
                  AND Attributes['state'] = 'active'
                  AND match(Attributes['name'], '^(openbao-cert-renew|step-ca-cert-renew)\\.service$')
                GROUP BY host_name, name
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
