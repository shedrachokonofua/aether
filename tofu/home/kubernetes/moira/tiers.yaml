# Highest reasoning_effort each upstream accepts. Verified 2026-10-01 via
# LiteLLM: MiMo V2.6 Pro/Flash return 400 for xhigh and max, 200 for high.
# grok-bridge rejects max (src/chat-request.ts accepts none..xhigh).
effort_caps:
  mimo-v2.6-pro: high
  mimo-v2.6-flash: high
  grok-4.7: xhigh

# Effort per upstream id when the request names none; a request's own effort
# passes through (capped above). Required for every general-tier member with
# an explicit effort: that effort is only its AA-rated one, which decides
# eligibility. `high` where the provider is known to accept it; the rest keep
# their rated effort until `high` is verified on that leg.
effort_defaults:
  claude-opus-5-5: high
  gpt-6.2-sol: high
  muse-wonder-full-1.0-contributor: high
  k3.1-pro: high              # Kimi takes low/high/max
  gpt-6.1-terra: high
  muse-wonder-1.0-contributor: high
  claude-sonnet-5-5: high
  qwen4-max: high             # Qwen4 takes low/high/xhigh
  grok-4.7: high
  claude-haiku-5-5: high
  qwen3.8-max: xhigh
  deepseek-v4.1-flash: high   # low/high/max; high verified on Ollama Cloud, Command Code and Go 2026-11-26
  glm-5.4: max
  glm-5.3: max                # seven30/glm-5.3; only max is AA-scored (32)
  glm-5.3-flash: max
  gpt-6-luna: high

# Moira tiers / providers / plans / groups.
#
# Local-count plans (xiaomi, qwen-cloud, codebuddy) need the operator's
# purchased tier (total_credits) and renewal date (cycle.anchor); a plan with
# either null produces no window.

# AA Intelligence Index v5, integer-rounded scores. Each general tier selects
# one model per shared quota pool; a member's effort is the AA-rated effort
# that places it in the band (cyber tiers also run it at that effort).
tiers:
  frontier:
    min: 50
    members:
      claude/opus-5-5: max
      chatgpt/gpt-6.2-sol: max
      meta/muse-wonder-full-1.0-contributor: max
      # Antigravity is out of every tier while Google's ToS suspension of the
      # account is under appeal (2026-11-25); restore these four entries after.
      # antigravity/gemini-4-neon: xhigh
      # Gemini 4 Argon high scores 50, but stays gated until its distinct
      # subscription quota is covered by the Antigravity usage bridge.
  strong:
    min: 40
    max: 49
    members:
      kimi/k3.1-pro: max
      chatgpt/gpt-6.1-terra: xhigh
      meta/muse-wonder-1.0-contributor: max
      claude/sonnet-5-5: high
      # Neon low (44) outscores Hydrogen medium (41) in the same Gemini pool.
      # Suspended with Antigravity (see frontier): antigravity/gemini-4-neon: low
      # Qwen4 Max has one native AA row (43); xhigh is its top effort.
      qwen-cloud/qwen4-max: xhigh
  balanced:
    min: 30
    max: 39
    members:
      supergrok/grok-4.7: high
      claude/haiku-5-5: xhigh
      qwen-cloud/qwen3.8-max: xhigh
      ollama-cloud/deepseek-v4.1-flash: max
      # Command Code and Go carry DeepSeek here instead of MiMo V2.6 Pro since
      # 2026-11-26 (one member per provider): it scores 32 against 30, its
      # cache reads cost $0.003/M on both, and Go allows it 100 a month
      # against MiMo Pro's 15. MiMo Pro stays their cyber member.
      commandcode/deepseek-v4.1-flash: max
      opencode-go/deepseek-v4.1-flash: max
      zai/glm-5.4: max
      xiaomi/mimo-v2.6-pro: default
      # Seven30's own Z.AI Coding Plan (co-founder's key, added 2026-11-27):
      # GLM-5.3 max scores 32. LiteLLM runs one request at a time on it, so
      # a busy slot answers 429 and the request moves to Moira's fallbacks.
      seven30/glm-5.3: max
  flash:
    min: 25
    max: 29
    members:
      zai/glm-5.3-flash: max
      ollama-cloud/glm-5.3-flash: max
      chatgpt/gpt-6-luna: max
      xiaomi/mimo-v2.6-flash: default
      commandcode/mimo-v2.6-flash: default
      opencode-go/mimo-v2.6-flash: default
      # Suspended with Antigravity (see frontier): antigravity/gemini-4-hydrogen: low
  # AA Cyber Index v1, checked 2026-10-30: one representative per quota pool.
  # Zero safety blocks across all three evaluations.
  cyber:
    index: cyber
    min: 40
    max_refusal: 0
    members:
      kimi/k3.1-pro: max
      ollama-cloud/deepseek-v4.1-flash: max
      supergrok/grok-4.7: xhigh
      xiaomi/mimo-v2.6-pro: default
      commandcode/mimo-v2.6-pro: default
      opencode-go/mimo-v2.6-pro: default
      chatgpt/gpt-6-luna: max
      zai/glm-5.3-flash: max

exclude:
  upstream_ids: [gpt-6-astra]          # never in tiers
  # ollama-cloud is back in tiers since 2026-10-07: its GLM/DeepSeek legs now
  # use Ollama's OpenAI-compatible /v1 instead of LiteLLM's ollama_chat
  # adapter, which had merged parallel tool calls ("Extra data"). Verified
  # with a 7-case matrix per model (litellm_config.yaml.tftpl Ollama block).
  # aether = local llama-swap (may be enabled later).
  # clinepass: both Cline Pass legs fail through LiteLLM (glm-5.3-flash 500
  # "empty response content", qwen3.8-max 404 / no `choices`; 1 success since
  # 2026-10-06) while its quota still reads 31% weekly, so Moira ranked it
  # first for moira/strong and agent turns died (2026-10-10). Re-enable each
  # once a direct call through LiteLLM succeeds.
  providers: [aether, clinepass]

providers:                  # model-name prefix -> provider id + quota source
  - { prefix: "chatgpt/",      id: chatgpt,      quota: { kind: sidecar } }
  - { prefix: "meta/",         id: muse,         quota: { kind: bridge, bridge: muse } }
  # All Claude subscription variants share the operator's interactive allowance:
  # Opus serves frontier, Sonnet strong, and Haiku balanced.
  - { prefix: "claude/",       id: claude,       quota: { kind: bridge, bridge: claude } }
  # One Cline account, two meters: `cline-pass/*` upstreams draw on the Pass
  # plan (usage-limits windows); every other upstream bills Cline credits
  # (balance; 402 insufficient_credits once spent), so it gets its own quota.
  - { prefix: "clinepass/", upstream_prefix: "openai/cline-pass/", id: clinepass, quota: { kind: endpoint } }
  - { prefix: "clinepass/",    id: clinepass-credits, quota: { kind: endpoint } }
  - { prefix: "kimi/",         id: kimi,         quota: { kind: endpoint } }
  - { prefix: "zai/",          id: zai,          quota: { kind: endpoint } }
  - { prefix: "seven30/",      id: zai-seven30,  quota: { kind: endpoint } }
  - { prefix: "commandcode/",  id: commandcode,  quota: { kind: endpoint } }
  # Free (`:free` / $0) legs: no plan quota to track, so `none`. They rank
  # after providers with known quota (no windows -> freshness "unknown"), i.e.
  # free models backstop once expiring subscription quota is spent.
  - { prefix: "commandcode-free/", id: commandcode-free, quota: { kind: none } }
  - { prefix: "openrouter/",   id: openrouter,   quota: { kind: none } }
  - { prefix: "opencode-go/",  id: opencode-go,  quota: { kind: endpoint } }
  - { prefix: "ollama-cloud/", id: ollama-cloud, quota: { kind: endpoint } }
  - { prefix: "antigravity/",  id: antigravity,  quota: { kind: bridge, bridge: antigravity } }
  - { prefix: "supergrok/",    id: supergrok,    quota: { kind: bridge, bridge: grok } }
  - { prefix: "xiaomi/",       id: xiaomi,       quota: { kind: local, plan: xiaomi } }
  - { prefix: "qwen-cloud/",   id: qwen-cloud,   quota: { kind: local, plan: qwen-cloud } }
  # CodeBuddy 400s non-streaming chat (11101); verified 2026-10-08.
  - { prefix: "codebuddy/",    id: codebuddy,    quota: { kind: local, plan: codebuddy }, chat_requires_stream: true }
  - { prefix: "aether/",       id: aether,       quota: { kind: none } }

# Router pools Moira ranks. Included only when every leg of the LiteLLM
# router pool has a standalone pin in litellm_config.yaml.tftpl, so each
# member is individually addressable. Excluded pools (legs without a
# standalone pin): router/minimax-m3. Any router/<model> not listed here
# passes through to LiteLLM untouched.
groups:
  router/glm-5.3: [zai/glm-5.3, ollama-cloud/glm-5.3]
  router/glm-5.3-flash: [zai/glm-5.3-flash, commandcode/glm-5.3-flash, opencode-go/glm-5.3-flash, ollama-cloud/glm-5.3-flash]
  router/mimo-v2.6-pro: [xiaomi/mimo-v2.6-pro, commandcode/mimo-v2.6-pro, opencode-go/mimo-v2.6-pro]
  router/mimo-v2.6-flash: [xiaomi/mimo-v2.6-flash, commandcode/mimo-v2.6-flash, opencode-go/mimo-v2.6-flash]
  router/hy4-preview: [codebuddy/hy4-preview, commandcode/hy4-preview, opencode-go/hy4-preview]
  router/muse-spark-1.3-contributor: [meta/muse-spark-1.3-contributor, commandcode/muse-spark-1.3-contributor, clinepass/muse-spark-1.3-contributor]
  router/deepseek-v4-pro: [ollama-cloud/deepseek-v4-pro]
  router/ling-3.1-flash: [openrouter/ling-3.1-flash, commandcode-free/ling-3.1-flash]
  # Deskplane's browser/desktop agent (DESKPLANE_MCP_MODEL). Members need tool
  # calling and vision. Terra is the operator-selected primary, then Gemini 4
  # Hydrogen (replaced the benchmarked Gemini 3.8 Flash on 2026-11-23 without its
  # own computer-use benchmark), then self-hosted Qwen with no cloud quota.
  # Suspended with Antigravity (see frontier): antigravity/gemini-4-hydrogen second.
  moira/computer-use: [chatgpt/gpt-6.1-terra, aether/qwen3.8-flash-next]

# Groups ranked by member order instead of quota urgency. Exhausted members are
# still skipped; the next ones become the LiteLLM fallbacks.
group_order:
  moira/computer-use: preference

plans:                      # local-count providers
  xiaomi:
    # Standard annual: one 132B pool valid until 2027-11-03 23:59:59 UTC.
    # Paced as 1/12 per month (11B): ranking is % left per hour to reset, so
    # the whole year-long pool ranked last behind every weekly plan and went
    # unused (0.1% by 2026-11-26). Unspent monthly credits stay in Xiaomi's
    # pool; Moira just stops counting them after the month.
    cycle: { anchor: "2026-11-04T00:00:00Z", period: month }
    total_credits: 11000000000
    offpeak: { utc_from: 16, utc_to: 24, factor: 0.8 }
    rates:   # credits per token
      mimo-v2.6-pro:   { cached: 2.5, input: 300, output: 600 }
      mimo-v2.6-flash: { cached: 2,   input: 100, output: 200 }
    calibration: { used: 36742997, at: "2026-11-07T00:44:29Z" }   # operator console screenshot
  qwen-cloud:
    # Pro individual: 180,000 credits per 30-day cycle; reset 2026-10-30
    # 12:00 EDT = 16:00Z (usage API per1MonthResetTime). Rates measured
    # 2026-10-03 with controlled batches against the usage API at Beijing
    # night (0.482 / 0.0597 / 1.44 per 1k): credits = PAYG USD x ~241 at night,
    # exact $2 / $0.25 / $6 ratios. Daytime rates below assume Alibaba's
    # documented 0.4x night factor (22:00-08:00 Beijing = 14:00-24:00 UTC);
    # one daytime batch would confirm it.
    cycle: { anchor: "2026-09-30T16:00:00Z", period: 30d }
    total_credits: 180000
    offpeak: { utc_from: 14, utc_to: 24, factor: 0.4 }
    rates:
      qwen3.8-max: { cached: 0.0001493, input: 0.0012055, output: 0.0036156 }
      # Qwen4-Max: 0.75x qwen3.8-max from PAYG list prices ($1.5 / $4.5 vs
      # $2 / $6). Its cache-read price is unpublished; the cached rate keeps
      # qwen3.8-max's cached:input ratio until a batch measures it.
      qwen4-max: { cached: 0.0001120, input: 0.0009041, output: 0.0027117 }
    # Qwen answered "token-plan 1-month quota has been exhausted ... reset at
    # 10-30 16:00:00 UTC" at 2026-10-11T00:08Z while the meter read 91.7%: the
    # estimated rates undercount, so the calibration takes the provider's word.
    calibration: { used: 180000, at: "2026-10-11T00:08:00Z" }
  codebuddy:
    # Pro (CodeBuddy Intl console 2026-10-09): 1,000 base credits per cycle;
    # next cycle 2026-10-31 10:02:09 UTC+8. The 1,000 bonus (赠送) credits are
    # left out until a renewal shows whether they recur.
    cycle: { anchor: "2026-10-31T02:02:09Z", period: month }
    total_credits: 1000
    # Hy4 reports reasoning in completion_tokens_details only and bills it.
    reasoning_outside_completion: true
    rates:
      # Solved from console charges at 2-decimal rounding (2026-10-09):
      # 41,209 in + 56 out = 2.92; 34 in + 4,006 out (4,000 reasoning) = 0.58.
      hy4-preview: { cached: 0.000070662, input: 0.000070662, output: 0.00014418 }
    calibration: { used: 6.49, at: "2026-10-09T00:07:00Z" }   # console 基础用量 after the batch

bridges:
  grok:        { url: "http://grok-bridge.grok.svc.cluster.local:8080",               key_env: GROK_BRIDGE_API_KEY }
  antigravity: { url: "http://antigravity-bridge.antigravity.svc.cluster.local:8080", key_env: ANTIGRAVITY_API_KEY }
  muse:        { url: "http://muse-bridge.muse.svc.cluster.local:8080",               key_env: MUSE_BRIDGE_API_KEY }
  claude:      { url: "http://claude-bridge.claude.svc.cluster.local:8080",           key_env: CLAUDE_BRIDGE_API_KEY }

sidecar: { url: "http://litellm.litellm.svc.cluster.local:9090", token_env: MOIRA_SIDECAR_TOKEN }
session: { idle_minutes: 30 }
staleness: { fresh_minutes: 15, stale_minutes: 60 }
